<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Block Blast 消除塊</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      box-sizing: border-box;
    }
    
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      transition: background-color 0.3s, color 0.3s;
    }

    body.dark { background-color: #121212; color: #ffffff; }
    body.light { background-color: #f3f4f6; color: #111827; }

    /* 棋盤邊框與樣式 */
    .board-container {
      position: relative;
      background: rgba(20, 20, 20, 0.92);
      border: 3.5px solid #ff3333;
      border-radius: 18px;
      box-shadow: 0 0 22px rgba(255, 51, 51, 0.45), inset 0 0 15px rgba(0,0,0,0.8);
    }
    body.light .board-container {
      background: #ffffff;
      border-color: #ff4d4d;
      box-shadow: 0 4px 22px rgba(255, 77, 77, 0.35);
    }

    .cell {
      background-color: rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      transition: background-color 0.1s ease, transform 0.1s ease;
    }
    body.light .cell {
      background-color: rgba(0, 0, 0, 0.07);
    }

    /* 落點預覽影子（High Contrast Ghost Preview） */
    .cell-preview {
      background-color: rgba(255, 255, 255, 0.6) !important;
      border: 2px dashed rgba(255, 255, 255, 0.95);
      box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.9), 0 0 8px rgba(255, 255, 255, 0.6);
      transform: scale(0.96);
    }
    body.light .cell-preview {
      background-color: rgba(0, 0, 0, 0.35) !important;
      border: 2px dashed rgba(0, 0, 0, 0.85);
      box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.4);
    }

    /* 預告發光提示動畫 */
    .will-clear {
      background-color: #facc15 !important;
      box-shadow: 0 0 16px #facc15, inset 0 0 8px #ffffff;
      animation: pulseGlow 0.4s infinite alternate ease-in-out;
      z-index: 5;
    }
    @keyframes pulseGlow {
      0% { transform: scale(0.94); opacity: 0.75; }
      100% { transform: scale(1.04); opacity: 1; }
    }

    /* 消除爆破消失動畫 */
    .line-blast {
      animation: blastOut 0.35s ease-out forwards !important;
      z-index: 10;
    }
    @keyframes blastOut {
      0% { transform: scale(1); filter: brightness(2.5); }
      50% { transform: scale(1.25) rotate(4deg); filter: brightness(4); opacity: 0.9; }
      100% { transform: scale(0); opacity: 0; }
    }

    /* 方塊配色 */
    .block-cyan   { background: linear-gradient(135deg, #06b6d4, #0891b2); box-shadow: inset 0 2px 4px rgba(255,255,255,0.4); }
    .block-purple { background: linear-gradient(135deg, #a855f7, #7e22ce); box-shadow: inset 0 2px 4px rgba(255,255,255,0.4); }
    .block-pink   { background: linear-gradient(135deg, #ec4899, #be185d); box-shadow: inset 0 2px 4px rgba(255,255,255,0.4); }
    .block-red    { background: linear-gradient(135deg, #ef4444, #b91c1c); box-shadow: inset 0 2px 4px rgba(255,255,255,0.4); }
    .block-blue   { background: linear-gradient(135deg, #3b82f6, #1d4ed8); box-shadow: inset 0 2px 4px rgba(255,255,255,0.4); }
    .block-green  { background: linear-gradient(135deg, #22c55e, #15803d); box-shadow: inset 0 2px 4px rgba(255,255,255,0.4); }
    .block-orange { background: linear-gradient(135deg, #f97316, #c2410c); box-shadow: inset 0 2px 4px rgba(255,255,255,0.4); }

    /* 底部托盤區 */
    .tray-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
    }
    body.light .tray-box {
      background: rgba(0, 0, 0, 0.03);
      border-color: rgba(0, 0, 0, 0.08);
    }

    .draggable-piece {
      cursor: grab;
      touch-action: none;
    }

    .dragging-clone {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      filter: drop-shadow(0 12px 20px rgba(0,0,0,0.6));
      will-change: left, top;
    }

    .modal-overlay {
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(5px);
    }
  </style>
</head>
<body class="dark flex flex-col items-center justify-between p-3">

  <!-- 頂部區塊 -->
  <header class="w-full max-w-lg flex flex-col gap-2.5 z-10">
    <!-- 第一列：功能切換列 -->
    <div class="flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-1.5 px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-white font-medium text-xs sm:text-sm rounded-full transition shadow border border-slate-700">
        <span>🏠</span> <span data-i18n="home">主選單</span>
      </a>
      <div class="flex items-center gap-2">
        <button id="lang-btn" class="px-3 py-1.5 bg-amber-500 hover:bg-amber-600 text-white font-semibold text-xs sm:text-sm rounded-full transition shadow">
          English
        </button>
        <button id="theme-btn" class="px-3 py-1.5 bg-purple-600 hover:bg-purple-700 text-white font-semibold text-xs sm:text-sm rounded-full transition shadow flex items-center gap-1">
          <span id="theme-icon">🌸</span> <span id="theme-text">淺色</span>
        </button>
      </div>
    </div>

    <!-- 第二列：標題與主動作按鈕 -->
    <div class="flex items-center justify-between my-0.5">
      <div class="flex items-center gap-2">
        <span class="text-xl sm:text-2xl">❌⭕</span>
        <h1 class="text-lg sm:text-xl font-black tracking-wide">Block Blast</h1>
      </div>
      <div class="flex items-center gap-1.5">
        <button id="help-btn" class="px-2.5 py-1 bg-sky-500 hover:bg-sky-600 text-white text-xs font-bold rounded-lg transition shadow">
          <span data-i18n="rules">說明</span>
        </button>
        <button id="restart-btn" class="px-2.5 py-1 bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-bold rounded-lg transition shadow">
          <span data-i18n="restart">重來</span>
        </button>
        <button id="reset-stats-btn" class="px-2.5 py-1 bg-rose-500 hover:bg-rose-600 text-white text-xs font-bold rounded-lg transition shadow">
          <span data-i18n="resetStats">重置</span>
        </button>
      </div>
    </div>

    <!-- 第三列：得分戰績面板 -->
    <div class="grid grid-cols-4 gap-1.5 text-center text-xs font-bold">
      <div class="py-1.5 px-1 bg-slate-800/80 rounded-xl border border-slate-700/60 shadow flex flex-col items-center">
        <span class="text-slate-400 text-[10px]" data-i18n="score">分數</span>
        <span id="score-val" class="text-sky-400 text-sm font-extrabold">0</span>
      </div>
      <div class="py-1.5 px-1 bg-slate-800/80 rounded-xl border border-slate-700/60 shadow flex flex-col items-center">
        <span class="text-slate-400 text-[10px]" data-i18n="highScore">最高</span>
        <span id="high-score-val" class="text-emerald-400 text-sm font-extrabold">0</span>
      </div>
      <div class="py-1.5 px-1 bg-slate-800/80 rounded-xl border border-slate-700/60 shadow flex flex-col items-center">
        <span class="text-slate-400 text-[10px]" data-i18n="combo">連擊</span>
        <span id="combo-val" class="text-amber-400 text-sm font-extrabold">0</span>
      </div>
      <div class="py-1.5 px-1 bg-slate-800/80 rounded-xl border border-slate-700/60 shadow flex flex-col items-center">
        <span class="text-slate-400 text-[10px]" data-i18n="maxCombo">最高連擊</span>
        <span id="max-combo-val" class="text-purple-400 text-sm font-extrabold">0</span>
      </div>
    </div>
  </header>

  <!-- 棋盤容器 -->
  <main class="flex-1 flex items-center justify-center w-full my-1 z-10">
    <div id="board-wrapper" class="board-container p-2 flex items-center justify-center" style="width: min(82vw, 42vh); height: min(82vw, 42vh);">
      <div id="grid-board" class="grid grid-cols-8 grid-rows-8 gap-1 w-full h-full">
        <!-- 64 格子 -->
      </div>
    </div>
  </main>

  <!-- 底部備選區 -->
  <footer class="w-full max-w-lg tray-box p-2 mb-1 z-10">
    <div id="tray-container" class="grid grid-cols-3 gap-2 h-20 sm:h-24 items-center justify-items-center">
      <!-- 3 個備選方塊 -->
    </div>
  </footer>

  <!-- 對話框 -->
  <div id="modal" class="fixed inset-0 modal-overlay z-50 flex items-center justify-center hidden p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl p-5 max-w-xs w-full text-center shadow-2xl flex flex-col items-center gap-3">
      <h3 id="modal-title" class="text-lg font-extrabold text-white"></h3>
      <p id="modal-msg" class="text-xs text-slate-300 leading-relaxed"></p>
      <div class="flex items-center gap-2 w-full mt-1">
        <button id="modal-restart" class="hidden px-4 py-2 bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-xl transition shadow flex-1 text-xs" data-i18n="restart">
          重新開始
        </button>
        <button id="modal-close" class="px-4 py-2 bg-sky-500 hover:bg-sky-600 text-white font-bold rounded-xl transition shadow flex-1 text-xs" data-i18n="close">
          確定
        </button>
      </div>
    </div>
  </div>

  <script>
    const i18n = {
      zh: {
        home: "主選單",
        rules: "說明",
        restart: "重來",
        resetStats: "重置戰績",
        score: "分數",
        highScore: "最高分數",
        combo: "連擊",
        maxCombo: "最高連擊",
        close: "確定",
        ruleTitle: "📖 遊戲規則",
        ruleMsg: "1. 將底部的方塊拖移放進 8x8 棋盤中。<br>2. 填滿任意整行或整列即可消除得分！<br>3. <b>Combo 指數加分與緩衝機制：</b>連續消除可觸發 Combo 指數倍率加分！若連續 <b>3 步都未消除</b>，Combo 連擊才會歸零！<br>4. 拖移時鼠標精準保持在方塊正中心，自動對齊與預覽落點！<br>5. 棋盤再無空間放置任何備選方塊時遊戲結束。",
        gameOverTitle: "🎮 遊戲結束",
        gameOverMsg: "棋盤空間不足！<br>最終分數：<b>{score}</b> 分",
        resetConfirm: "已成功重置所有紀錄與最高連擊！"
      },
      en: {
        home: "Home",
        rules: "Rules",
        restart: "Restart",
        resetStats: "Reset",
        score: "Score",
        highScore: "Best",
        combo: "Combo",
        maxCombo: "Max Combo",
        close: "OK",
        ruleTitle: "📖 How to Play",
        ruleMsg: "1. Drag block shapes into the 8x8 grid.<br>2. Complete full rows/cols to clear them!<br>3. <b>Exponential Combo Bonus:</b> Higher combos reward exponentially more bonus points! Combo resets after <b>3 consecutive moves</b> without line clears.<br>4. Mouse pointer centers perfectly on dragged blocks with accurate ghost preview snapping!<br>5. Game ends when no valid moves remain.",
        gameOverTitle: "🎮 Game Over",
        gameOverMsg: "No space left for remaining shapes!<br>Final Score: <b>{score}</b>",
        resetConfirm: "Stats and high score have been reset!"
      }
    };

    let lang = 'zh';
    let theme = 'dark';

    const BOARD_SIZE = 8;
    let grid = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(null));
    let score = 0;
    let highScore = parseInt(localStorage.getItem('bb_highScore') || '0', 10);
    let combo = 0;
    let movesWithoutClear = 0;
    let maxCombo = parseInt(localStorage.getItem('bb_maxCombo') || '0', 10);
    let trayPieces = [null, null, null];
    let isGameOver = false;

    const SHAPES = [
      { shape: [[1]], color: 'block-cyan', level: 1 },
      { shape: [[1, 1]], color: 'block-purple', level: 1 },
      { shape: [[1], [1]], color: 'block-purple', level: 1 },
      { shape: [[1, 1], [1, 1]], color: 'block-red', level: 1 },
      { shape: [[1, 0], [1, 1]], color: 'block-green', level: 1 },
      { shape: [[1, 1], [0, 1]], color: 'block-green', level: 1 },
      { shape: [[1, 1, 1]], color: 'block-pink', level: 2 },
      { shape: [[1], [1], [1]], color: 'block-pink', level: 2 },
      { shape: [[1, 1, 1], [0, 1, 0]], color: 'block-purple', level: 2 },
      { shape: [[0, 1, 0], [1, 1, 1]], color: 'block-pink', level: 2 },
      { shape: [[1, 1, 1, 1]], color: 'block-blue', level: 3 },
      { shape: [[1], [1], [1], [1]], color: 'block-blue', level: 3 },
      { shape: [[1, 1, 1], [1, 1, 1], [1, 1, 1]], color: 'block-orange', level: 3 }
    ];

    const gridBoard = document.getElementById('grid-board');
    const trayContainer = document.getElementById('tray-container');
    const scoreVal = document.getElementById('score-val');
    const highScoreVal = document.getElementById('high-score-val');
    const comboVal = document.getElementById('combo-val');
    const maxComboVal = document.getElementById('max-combo-val');

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;
      if (type === 'place') {
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(160, now + 0.08);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
        osc.start(now);
        osc.stop(now + 0.08);
      } else if (type === 'clear') {
        osc.frequency.setValueAtTime(450 + combo * 60, now);
        osc.frequency.exponentialRampToValueAtTime(900 + combo * 90, now + 0.22);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.22);
        osc.start(now);
        osc.stop(now + 0.22);
      } else if (type === 'gameover') {
        osc.frequency.setValueAtTime(240, now);
        osc.frequency.linearRampToValueAtTime(90, now + 0.35);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
        osc.start(now);
        osc.stop(now + 0.35);
      }
    }

    function init() {
      setupBoard();
      updateUIStrings();
      updateScoreboard();
      spawnTrayPieces();
      setupEventListeners();
    }

    function setupBoard() {
      gridBoard.innerHTML = '';
      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell w-full h-full';
          cell.dataset.r = r;
          cell.dataset.c = c;
          gridBoard.appendChild(cell);
        }
      }
    }

    function renderBoard() {
      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          const cell = gridBoard.children[r * BOARD_SIZE + c];
          cell.className = 'cell w-full h-full';
          if (grid[r][c]) {
            cell.classList.add(grid[r][c]);
          }
        }
      }
    }

    function updateScoreboard() {
      scoreVal.textContent = score;
      highScoreVal.textContent = highScore;
      comboVal.textContent = combo;
      maxComboVal.textContent = maxCombo;
    }

    function updateUIStrings() {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (i18n[lang][key]) el.innerHTML = i18n[lang][key];
      });
      document.getElementById('lang-btn').textContent = lang === 'zh' ? 'English' : '繁體中文';
    }

    function spawnTrayPieces() {
      trayContainer.innerHTML = '';
      
      // 使用智慧演算法生成當前輪次的 3 個方塊
      const activeShapes = selectSmartPieces();

      for (let i = 0; i < 3; i++) {
        const slot = document.createElement('div');
        slot.className = 'w-full h-full flex items-center justify-center';
        slot.dataset.slotIndex = i;

        const piece = activeShapes[i];
        trayPieces[i] = piece;

        const pieceEl = createPieceDOM(piece, i);
        slot.appendChild(pieceEl);
        trayContainer.appendChild(slot);
      }
      checkGameOver();
    }

    // 智慧方塊選取演算法 (動態難度 + 連擊 Combo 導向)
    function selectSmartPieces() {
      const currentBoardFilled = countFilledCells();
      const selected = [];

      // 判斷遊戲進程 (0: 開局輕鬆體驗區, 1: 中期漸進挑戰, 2: 後期高難度)
      let stage = 0;
      if (score >= 1200) stage = 2;
      else if (score >= 400) stage = 1;

      for (let i = 0; i < 3; i++) {
        // 根據 stage 篩選適當難度等級的方塊庫
        let candidates = SHAPES.filter(s => {
          if (stage === 0) return s.level <= 2; // 初期的方塊簡單且極易擺放
          if (stage === 1) return s.level <= 3;
          return true; // 後期開放所有複雜與大型方塊
        });

        const weightedPool = [];

        candidates.forEach(p => {
          let weight = 10; // 基礎權重

          // 1. 檢查該方塊是否能放置於目前棋盤中 (避開立即 Game Over)
          const fitPositions = getValidPositions(p.shape);
          if (fitPositions.length === 0) {
            weight = 0; // 無法放置的方塊權重歸零
          } else {
            // 2. 開局階段 (stage 0)：極力鼓勵提供能清空板面的小方塊與消除機會
            if (stage === 0) {
              if (p.level === 1) weight += 20; // 提高小型方塊出現率
              if (currentBoardFilled > 0) {
                // 如果擺放該方塊能觸發消除，大幅提高權重，協助玩家清空全盤
                const canClear = fitPositions.some(pos => checkWillClearLines(p.shape, pos.r, pos.c));
                if (canClear) weight += 50;
              }
            } else {
              // 3. 中後期：若有連擊機會，適度提升可促成連擊的方塊機率
              const canClear = fitPositions.some(pos => checkWillClearLines(p.shape, pos.r, pos.c));
              if (canClear) {
                weight += (combo > 0 ? 35 : 20); // 連爆中給予適度連擊支援
              }
            }
          }

          // 建立加權池
          if (weight > 0) {
            for (let w = 0; w < weight; w++) {
              weightedPool.push(p);
            }
          }
        });

        // 隨機從加權池中挑選；若沒有合適方塊則退回基礎 Level 1 方塊
        if (weightedPool.length > 0) {
          const picked = weightedPool[Math.floor(Math.random() * weightedPool.length)];
          selected.push(picked);
        } else {
          const easyShapes = SHAPES.filter(s => s.level === 1);
          selected.push(easyShapes[Math.floor(Math.random() * easyShapes.length)]);
        }
      }

      return selected;
    }

    // 輔助函式：計算棋盤上已擺放的方塊數量
    function countFilledCells() {
      let count = 0;
      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          if (grid[r][c] !== null) count++;
        }
      }
      return count;
    }

    // 輔助函式：取得方塊在目前棋盤中所有合法的放置點
    function getValidPositions(shape) {
      const valid = [];
      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          if (canPlace(shape, r, c)) {
            valid.push({ r, c });
          }
        }
      }
      return valid;
    }

    // 輔助函式：模擬測試放置該方塊後是否會觸發整行或整列消除
    function checkWillClearLines(shape, startR, startC) {
      const tempGrid = grid.map(row => [...row]);
      for (let dr = 0; dr < shape.length; dr++) {
        for (let dc = 0; dc < shape[0].length; dc++) {
          if (shape[dr][dc] === 1) {
            tempGrid[startR + dr][startC + dc] = 'temp';
          }
        }
      }
      for (let r = 0; r < BOARD_SIZE; r++) {
        if (tempGrid[r].every(cell => cell !== null)) return true;
      }
      for (let c = 0; c < BOARD_SIZE; c++) {
        let full = true;
        for (let r = 0; r < BOARD_SIZE; r++) {
          if (tempGrid[r][c] === null) { full = false; break; }
        }
        if (full) return true;
      }
      return false;
    }

    function createPieceDOM(pieceObj, slotIndex) {
      const container = document.createElement('div');
      container.className = 'draggable-piece flex flex-col gap-0.5 p-1';
      container.dataset.slotIndex = slotIndex;

      const rows = pieceObj.shape.length;
      const cols = pieceObj.shape[0].length;

      for (let r = 0; r < rows; r++) {
        const rowDiv = document.createElement('div');
        rowDiv.className = 'flex gap-0.5';
        for (let c = 0; c < cols; c++) {
          const unit = document.createElement('div');
          unit.className = 'piece-unit w-3.5 h-3.5 sm:w-4 sm:h-4 rounded-sm';
          if (pieceObj.shape[r][c] === 1) {
            unit.className += ` ${pieceObj.color}`;
          } else {
            unit.className += ' opacity-0 pointer-events-none';
          }
          rowDiv.appendChild(unit);
        }
        container.appendChild(rowDiv);
      }

      enableDrag(container, pieceObj, slotIndex);
      return container;
    }

    function enableDrag(el, pieceObj, slotIndex) {
      let isDragging = false;
      let clone = null;

      function onPointerDown(e) {
        e.preventDefault();
        isDragging = true;

        clone = el.cloneNode(true);
        clone.className = 'draggable-piece dragging-clone flex flex-col gap-1';
        
        const cellRect = gridBoard.children[0].getBoundingClientRect();
        // 確保包含透明占位格在內的所有 unit 都同步放縮為棋盤格尺寸，防止形狀排版變形
        const cloneUnits = clone.querySelectorAll('.piece-unit');
        
        cloneUnits.forEach(u => {
          u.style.width = `${cellRect.width}px`;
          u.style.height = `${cellRect.height}px`;
          if (!u.classList.contains('opacity-0')) {
            u.style.borderRadius = '6px';
          }
        });

        document.body.appendChild(clone);
        el.style.opacity = '0.2';

        updateClonePos(e.clientX, e.clientY);

        window.addEventListener('pointermove', onPointerMove);
        window.addEventListener('pointerup', onPointerUp);
      }

      // 讓滑鼠/觸控點永遠精準保持在拖移圖形的幾何中心點
      function updateClonePos(x, y) {
        if (!clone) return;
        const rect = clone.getBoundingClientRect();
        clone.style.left = `${x - rect.width / 2}px`;
        clone.style.top = `${y - rect.height / 2}px`;
      }

      function onPointerMove(e) {
        if (!isDragging) return;
        updateClonePos(e.clientX, e.clientY);

        const targetPos = getTargetGridPos(e.clientX, e.clientY, pieceObj.shape);
        
        clearHighlights();

        // 僅在目標位置合法時顯示精準落點影子與消除預告
        if (targetPos && canPlace(pieceObj.shape, targetPos.r, targetPos.c)) {
          renderPreviewShadow(pieceObj.shape, targetPos.r, targetPos.c);
          highlightPreClear(pieceObj.shape, targetPos.r, targetPos.c);
        }
      }

      function onPointerUp(e) {
        if (!isDragging) return;
        isDragging = false;
        clearHighlights();

        const targetPos = getTargetGridPos(e.clientX, e.clientY, pieceObj.shape);

        let placed = false;
        if (targetPos && canPlace(pieceObj.shape, targetPos.r, targetPos.c)) {
          placePiece(pieceObj, targetPos.r, targetPos.c, slotIndex);
          placed = true;
        }

        if (clone) clone.remove();
        if (!placed) {
          el.style.opacity = '1';
        }

        window.removeEventListener('pointermove', onPointerMove);
        window.removeEventListener('pointerup', onPointerUp);
      }

      el.addEventListener('pointerdown', onPointerDown);
    }

    // 計算滑鼠（中心點）對應棋盤左上角的格子座標並進行邊界限制與智慧對齊
    function getTargetGridPos(clientX, clientY, shape) {
      const boardRect = gridBoard.getBoundingClientRect();
      const margin = 60; // 允許游標在棋盤外圍 60px 緩衝區內進行磁吸預覽

      // 游標超出棋盤範圍過遠則不顯示預覽
      if (
        clientX < boardRect.left - margin ||
        clientX > boardRect.right + margin ||
        clientY < boardRect.top - margin ||
        clientY > boardRect.bottom + margin
      ) {
        return null;
      }

      const cellW = boardRect.width / BOARD_SIZE;
      const cellH = boardRect.height / BOARD_SIZE;

      const rows = shape.length;
      const cols = shape[0].length;

      // 依鼠標中心計算理想左上角座標
      let rawC = Math.round((clientX - boardRect.left - (cols * cellW) / 2) / cellW);
      let rawR = Math.round((clientY - boardRect.top - (rows * cellH) / 2) / cellH);

      // 自動限制 (Clamp) 在棋盤合法行列範圍內 (防止靠邊拖移時座標溢出為負值)
      let clampedC = Math.max(0, Math.min(BOARD_SIZE - cols, rawC));
      let clampedR = Math.max(0, Math.min(BOARD_SIZE - rows, rawR));

      // 若限制後的座標可放置，直接返回
      if (canPlace(shape, clampedR, clampedC)) {
        return { r: clampedR, c: clampedC };
      }

      // 若完全重疊於障礙物，嘗試微幅搜尋鄰近 1 格內的合法落點
      const candidates = [
        { r: clampedR - 1, c: clampedC },
        { r: clampedR + 1, c: clampedC },
        { r: clampedR, c: clampedC - 1 },
        { r: clampedR, c: clampedC + 1 },
        { r: clampedR - 1, c: clampedC - 1 },
        { r: clampedR - 1, c: clampedC + 1 },
        { r: clampedR + 1, c: clampedC - 1 },
        { r: clampedR + 1, c: clampedC + 1 }
      ];

      for (const cand of candidates) {
        if (canPlace(shape, cand.r, cand.c)) {
          return cand;
        }
      }

      return { r: clampedR, c: clampedC };
    }

    function canPlace(shape, r, c) {
      const rows = shape.length;
      const cols = shape[0].length;
      
      if (r < 0 || c < 0 || r + rows > BOARD_SIZE || c + cols > BOARD_SIZE) {
        return false;
      }

      for (let dr = 0; dr < rows; dr++) {
        for (let dc = 0; dc < cols; dc++) {
          if (shape[dr][dc] === 1 && grid[r + dr][c + dc] !== null) {
            return false;
          }
        }
      }
      return true;
    }

    // 落點高對比虛線影子預覽
    function renderPreviewShadow(shape, startR, startC) {
      for (let dr = 0; dr < shape.length; dr++) {
        for (let dc = 0; dc < shape[0].length; dc++) {
          if (shape[dr][dc] === 1) {
            const idx = (startR + dr) * BOARD_SIZE + (startC + dc);
            const cell = gridBoard.children[idx];
            if (cell) cell.classList.add('cell-preview');
          }
        }
      }
    }

    // 消除預告動態發光
    function highlightPreClear(shape, startR, startC) {
      const tempGrid = grid.map(row => [...row]);
      for (let dr = 0; dr < shape.length; dr++) {
        for (let dc = 0; dc < shape[0].length; dc++) {
          if (shape[dr][dc] === 1) {
            tempGrid[startR + dr][startC + dc] = 'temp';
          }
        }
      }

      const fullRows = [];
      const fullCols = [];

      for (let r = 0; r < BOARD_SIZE; r++) {
        if (tempGrid[r].every(cell => cell !== null)) fullRows.push(r);
      }
      for (let c = 0; c < BOARD_SIZE; c++) {
        let full = true;
        for (let r = 0; r < BOARD_SIZE; r++) {
          if (tempGrid[r][c] === null) { full = false; break; }
        }
        if (full) fullCols.push(c);
      }

      fullRows.forEach(r => {
        for (let c = 0; c < BOARD_SIZE; c++) {
          gridBoard.children[r * BOARD_SIZE + c].classList.add('will-clear');
        }
      });
      fullCols.forEach(c => {
        for (let r = 0; r < BOARD_SIZE; r++) {
          gridBoard.children[r * BOARD_SIZE + c].classList.add('will-clear');
        }
      });
    }

    function clearHighlights() {
      document.querySelectorAll('.cell-preview').forEach(el => el.classList.remove('cell-preview'));
      document.querySelectorAll('.will-clear').forEach(el => el.classList.remove('will-clear'));
    }

    function placePiece(pieceObj, startR, startC, slotIndex) {
      const shape = pieceObj.shape;
      let tilesPlaced = 0;

      for (let dr = 0; dr < shape.length; dr++) {
        for (let dc = 0; dc < shape[0].length; dc++) {
          if (shape[dr][dc] === 1) {
            grid[startR + dr][startC + dc] = pieceObj.color;
            tilesPlaced++;
          }
        }
      }

      score += tilesPlaced * 10;
      playSound('place');

      trayPieces[slotIndex] = null;
      trayContainer.children[slotIndex].innerHTML = '';

      renderBoard();

      const clearedLines = processLines();

      if (clearedLines > 0) {
        combo++;
        movesWithoutClear = 0; // 重置未消除步數
        if (combo > maxCombo) {
          maxCombo = combo;
          localStorage.setItem('bb_maxCombo', maxCombo);
        }
        // 連擊指數加分機制：採用 50 * (1.3 ^ (combo - 1)) 的溫和指數成長
        const comboBonus = Math.floor(50 * Math.pow(1.3, combo - 1));
        score += clearedLines * 100 + comboBonus;
      } else {
        movesWithoutClear++;
        // 連續 3 步都沒有消除時，Combo 才歸零
        if (movesWithoutClear >= 3) {
          combo = 0;
        }
      }

      if (score > highScore) {
        highScore = score;
        localStorage.setItem('bb_highScore', highScore);
      }

      updateScoreboard();

      if (trayPieces.every(p => p === null)) {
        setTimeout(spawnTrayPieces, 180);
      } else {
        checkGameOver();
      }
    }

    function processLines() {
      const fullRows = [];
      const fullCols = [];

      for (let r = 0; r < BOARD_SIZE; r++) {
        if (grid[r].every(cell => cell !== null)) fullRows.push(r);
      }
      for (let c = 0; c < BOARD_SIZE; c++) {
        let full = true;
        for (let r = 0; r < BOARD_SIZE; r++) {
          if (grid[r][c] === null) { full = false; break; }
        }
        if (full) fullCols.push(c);
      }

      const totalLines = fullRows.length + fullCols.length;
      if (totalLines > 0) {
        playSound('clear');

        const cellsToClear = new Set();
        fullRows.forEach(r => {
          for (let c = 0; c < BOARD_SIZE; c++) cellsToClear.add(`${r},${c}`);
        });
        fullCols.forEach(c => {
          for (let r = 0; r < BOARD_SIZE; r++) cellsToClear.add(`${r},${c}`);
        });

        cellsToClear.forEach(pos => {
          const [r, c] = pos.split(',').map(Number);
          const cellEl = gridBoard.children[r * BOARD_SIZE + c];
          cellEl.classList.add('line-blast');
        });

        setTimeout(() => {
          cellsToClear.forEach(pos => {
            const [r, c] = pos.split(',').map(Number);
            grid[r][c] = null;
          });
          renderBoard();
        }, 320);
      }

      return totalLines;
    }

    function checkGameOver() {
      const remainingPieces = trayPieces.filter(p => p !== null);
      if (remainingPieces.length === 0) return;

      for (const p of remainingPieces) {
        for (let r = 0; r < BOARD_SIZE; r++) {
          for (let c = 0; c < BOARD_SIZE; c++) {
            if (canPlace(p.shape, r, c)) return;
          }
        }
      }

      isGameOver = true;
      playSound('gameover');
      showModal(i18n[lang].gameOverTitle, i18n[lang].gameOverMsg.replace('{score}', score), true);
    }

    function showModal(title, msg, showRestartBtn = false) {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-msg').innerHTML = msg;

      const modalRestartBtn = document.getElementById('modal-restart');
      if (showRestartBtn) {
        modalRestartBtn.classList.remove('hidden');
      } else {
        modalRestartBtn.classList.add('hidden');
      }

      document.getElementById('modal').classList.remove('hidden');
    }

    function hideModal() {
      document.getElementById('modal').classList.add('hidden');
    }

    function startNewGame() {
      grid = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(null));
      score = 0;
      combo = 0;
      movesWithoutClear = 0;
      isGameOver = false;
      updateScoreboard();
      renderBoard();
      spawnTrayPieces();
      hideModal();
    }

    function setupEventListeners() {
      document.getElementById('lang-btn').addEventListener('click', () => {
        lang = lang === 'zh' ? 'en' : 'zh';
        updateUIStrings();
      });

      document.getElementById('theme-btn').addEventListener('click', () => {
        theme = theme === 'dark' ? 'light' : 'dark';
        document.body.className = `${theme} flex flex-col items-center justify-between p-3`;
        document.getElementById('theme-icon').textContent = theme === 'dark' ? '🌸' : '🌙';
        document.getElementById('theme-text').textContent = theme === 'dark' ? (lang === 'zh' ? '淺色' : 'Light') : (lang === 'zh' ? '深色' : 'Dark');
      });

      document.getElementById('help-btn').addEventListener('click', () => {
        showModal(i18n[lang].ruleTitle, i18n[lang].ruleMsg, false);
      });

      document.getElementById('restart-btn').addEventListener('click', startNewGame);
      document.getElementById('modal-restart').addEventListener('click', startNewGame);

      document.getElementById('reset-stats-btn').addEventListener('click', () => {
        highScore = 0;
        maxCombo = 0;
        localStorage.removeItem('bb_highScore');
        localStorage.removeItem('bb_maxCombo');
        updateScoreboard();
        showModal(i18n[lang].resetStats, i18n[lang].resetConfirm, false);
      });

      document.getElementById('modal-close').addEventListener('click', hideModal);
    }

    init();
  </script>
</body>
