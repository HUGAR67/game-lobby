<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Appel Escape</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --panel-bg: #1e293b;
      --text-color: #f8fafc;
      --btn-bg: #334155;
      --btn-hover: #475569;
      --btn-active: #2563eb;
      --border-color: #475569;
    }

    body.light-mode {
      --bg-color: #f1f5f9;
      --panel-bg: #ffffff;
      --text-color: #0f172a;
      --btn-bg: #e2e8f0;
      --btn-hover: #cbd5e1;
      --btn-active: #3b82f6;
      --border-color: #cbd5e1;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      user-select: none;
      transition: background-color 0.3s, color 0.3s;
    }

    /* 手機阻擋畫面 */
    #mobileBlocker {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: var(--bg-color);
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }

    #mobileBlocker h2 {
      font-size: 2rem;
      color: #ef4444;
      margin-bottom: 10px;
    }

    #mobileBlocker p {
      font-size: 1.2rem;
      color: var(--text-color);
    }

    .top-right-bar {
      position: absolute;
      top: 15px;
      right: 15px;
      display: flex;
      gap: 10px;
    }

    button, a.btn-link {
      background-color: var(--btn-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      text-decoration: none;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s;
    }

    button:hover, a.btn-link:hover {
      background-color: var(--btn-hover);
    }

    .menu-container {
      background-color: var(--panel-bg);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 500px;
      width: 90%;
    }

    .menu-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      gap: 10px;
    }

    .menu-header h1 {
      margin: 0;
      font-size: 1.8rem;
      flex-grow: 1;
      text-align: center;
      white-space: nowrap;
    }

    .menu-header button, .menu-header a.btn-link {
      padding: 6px 12px;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    /* 作弊碼啟用提示標籤 */
    .cheat-status-badge {
      display: none;
      background-color: #f59e0b;
      color: #0f172a;
      font-size: 0.85rem;
      font-weight: bold;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 15px;
      text-align: center;
    }

    .tier-group {
      width: 100%;
      margin-bottom: 15px;
    }

    .tier-title {
      font-size: 1rem;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .level-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .level-btn {
      padding: 12px 0;
      text-align: center;
    }

    .level-btn.cleared {
      background-color: #10b981;
      color: #ffffff;
      border-color: #059669;
    }

    .level-btn.locked {
      opacity: 0.4;
      cursor: not-allowed;
      background-color: #1e293b;
      border-color: #334155;
    }

    .level-btn.locked:hover {
      background-color: #1e293b;
    }

    .game-container {
      display: none;
      flex-direction: column;
      align-items: center;
    }

    canvas {
      background-color: var(--panel-bg);
      border: 2px solid var(--border-color);
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    .ui-panel {
      width: 100%;
      max-width: 600px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    /* 自訂彈窗樣式 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.75);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      backdrop-filter: blur(4px);
    }

    .modal-card {
      background-color: var(--panel-bg);
      border: 2px solid var(--border-color);
      border-radius: 16px;
      padding: 30px;
      width: 85%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      animation: modalPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes modalPop {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .modal-title {
      font-size: 1.8rem;
      margin-top: 0;
      margin-bottom: 12px;
      color: #38bdf8;
    }

    .modal-body {
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .modal-death-highlight {
      font-size: 1.4rem;
      font-weight: bold;
      color: #ef4444;
      margin: 10px 0;
    }

    .modal-cheat-notice {
      margin-top: 10px;
      font-size: 0.9rem;
      color: #f59e0b;
      font-weight: bold;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .modal-btn-primary {
      background-color: #2563eb;
      color: #ffffff;
      border-color: #1d4ed8;
      padding: 10px 20px;
      font-size: 1rem;
    }

    .modal-btn-primary:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>
<body>

  <!-- 手機用戶阻擋畫面 -->
  <div id="mobileBlocker">
    <h2>📱 不支援手機裝置</h2>
    <p>本遊戲僅支援電腦或桌上型設備遊玩，請使用電腦開啟體驗最佳效果。</p>

      <h2 class="modal-title" id="modalTitle">🎉 突破完成！</h2>
      <div class="modal-body" id="modalBody"></div>

<script>
// 1. 檢查是否為手機或流動裝置
function checkMobileDevice() {
  const isMobileUserAgent = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
  const isSmallScreen = window.innerWidth <= 768;

  if (isMobileUserAgent || isSmallScreen) {
    document.getElementById('mobileBlocker').style.display = 'flex';
    document.getElementById('menuWrapper').style.display = 'none';
    document.querySelector('.top-right-bar').style.display = 'none';
    return true;
  }
  return false;
}

// 2. 檢查 URL 密匙 parameters
function isCheatUnlocked() {
  const urlParams = new URLSearchParams(window.location.search);
  return urlParams.get('key') === 'ji32k7au4a83';
}

const ctx = canvas.getContext('2d');

const AudioContext = window.AudioContext || window.webkitAudioContext;
const audioCtx = new AudioContext();

let deathCount = parseInt(localStorage.getItem('appel_deaths') || '0', 10);

function updateDeathsDisplay() {
  document.getElementById('deathsDisplay').innerText = deathCount;
}

function updateLanguageUI() {
  const t = i18n[currentLang];
  document.getElementById('homeBtn').innerText = t.home;
  document.getElementById('langToggleBtn').innerText = t.langBtn;
  
  const isLight = document.body.classList.contains('light-mode');

  if (isPlaying) {

      easy: t.easyName,
      medium: t.mediumName,
      hard: t.hardName,
      expert: t.expertName

    document.getElementById('tierDisplay').innerText = nameMap[currentTier];

function toggleLang() {
  currentLang = currentLang === 'zh' ? 'en' : 'zh';

function toggleTheme() {
  document.body.classList.toggle('light-mode');

function playSound(freq, duration, type = 'sine') {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

function clearKeys() {
  for (let k in keys) keys[k] = false;

let currentTier = 'easy';

function getClearedLevels() {
  return JSON.parse(localStorage.getItem('appel_cleared') || '{}');
}

function markLevelCleared(tier, idx) {
  // 開啟作弊碼時直接 return，不寫入存檔
  if (isCheatUnlocked()) return;

  const cleared = getClearedLevels();
  if (!cleared[tier]) cleared[tier] = [];
  if (!cleared[tier].includes(idx)) {
    cleared[tier].push(idx);
    localStorage.setItem('appel_cleared', JSON.stringify(cleared));
  }
}

function isLevelUnlocked(tier, idx) {
  if (isCheatUnlocked()) return true;

  const cleared = getClearedLevels();
  
  if (tier === 'easy' && idx === 0) return true;
  if (cleared[tier] && cleared[tier].includes(idx)) return true;

  if (idx > 0) {
    return cleared[tier] && cleared[tier].includes(idx - 1);
  }

  const tierIndex = tierOrder.indexOf(tier);
  if (tierIndex > 0) {
    const prevTier = tierOrder[tierIndex - 1];
    return cleared[prevTier] && cleared[prevTier].includes(4);
  }

  return false;
}

function resetProgress() {
  if (confirm(i18n[currentLang].confirmReset)) {
    localStorage.removeItem('appel_cleared');
    localStorage.removeItem('appel_deaths');
    deathCount = 0;
    updateDeathsDisplay();
    initMenu();
  }
}

function isColliding(px, py, pw, ph, rect) {
  return px < rect.x + rect.w &&
         px + pw > rect.x &&
         py < rect.y + rect.h &&
         py + ph > rect.y;
}

function isRectTriangleColliding(rect, spike) {
  let triPts = [];
  if (spike.dir === 'up') {
    triPts = [
      { x: spike.x, y: spike.y },
      { x: spike.x + spike.w / 2, y: spike.y - spike.h },
      { x: spike.x + spike.w, y: spike.y }
    ];
  } else if (spike.dir === 'left') {
    triPts = [
      { x: spike.x, y: spike.y },
      { x: spike.x - spike.w, y: spike.y + spike.h / 2 },
      { x: spike.x, y: spike.y + spike.h }
    ];
  }

  for (let pt of triPts) {
    if (pt.x >= rect.x && pt.x <= rect.x + rect.w &&
        pt.y >= rect.y && pt.y <= rect.y + rect.h) {
      return true;
    }
  }

  const rectPts = [
    { x: rect.x, y: rect.y },
    { x: rect.x + rect.w, y: rect.y },
    { x: rect.x + rect.w, y: rect.y + rect.h },
    { x: rect.x, y: rect.y + rect.h }
  ];
  for (let pt of rectPts) {
    if (isPointInTriangle(pt, triPts[0], triPts[1], triPts[2])) {
      return true;
    }
  }

  const rectEdges = [
    [rectPts[0], rectPts[1]],
    [rectPts[1], rectPts[2]],
    [rectPts[2], rectPts[3]],
    [rectPts[3], rectPts[0]]
  ];
  const triEdges = [
    [triPts[0], triPts[1]],
    [triPts[1], triPts[2]],
    [triPts[2], triPts[0]]
  ];

  for (let re of rectEdges) {
    for (let te of triEdges) {
      if (lineIntersects(re[0], re[1], te[0], te[1])) {
        return true;
      }
    }
  }

  return false;
}

function isPointInTriangle(p, a, b, c) {
  function area(p1, p2, p3) {
    return Math.abs((p1.x * (p2.y - p3.y) + p2.x * (p3.y - p1.y) + p3.x * (p1.y - p2.y)) / 2.0);
  }
  let A = area(a, b, c);
  let A1 = area(p, b, c);
  let A2 = area(a, p, c);
  let A3 = area(a, b, p);
  return Math.abs(A - (A1 + A2 + A3)) < 0.1;
}

function lineIntersects(p1, p2, p3, p4) {
  function CCW(pA, pB, pC) {
    return (pC.y - pA.y) * (pB.x - pA.x) > (pB.y - pA.y) * (pC.x - pA.x);
  }
  return (CCW(p1, p3, p4) !== CCW(p2, p3, p4)) && (CCW(p1, p2, p3) !== CCW(p1, p2, p4));
}

const allLevels = generateAppelLevels();

function initMenu() {
  if (checkMobileDevice()) return;

  const map = { easy: 'easyBtns', medium: 'medBtns', hard: 'hardBtns', expert: 'expBtns' };
  const cleared = getClearedLevels();

  const cheatBadge = document.getElementById('cheatBadge');
  if (isCheatUnlocked()) {
    cheatBadge.style.display = 'block';
  } else {
    cheatBadge.style.display = 'none';
  }

  for (let t in map) {
    const container = document.getElementById(map[t]);
    container.innerHTML = '';
    for (let i = 0; i < 5; i++) {
      const btn = document.createElement('button');
      btn.className = 'level-btn';
      
      const isCleared = cleared[t] && cleared[t].includes(i);
      const unlocked = isLevelUnlocked(t, i);

      if (isCleared) {
        btn.innerText = `✓`;
        btn.classList.add('cleared');
      } else if (unlocked) {
        btn.innerText = `${i + 1}`;
      } else {
        btn.innerText = `🔒`;
        btn.classList.add('locked');
        btn.disabled = true;
      }
      
      if (unlocked) {
        btn.onclick = () => startLevel(t, i);
      }

      container.appendChild(btn);
    }
  }
  updateDeathsDisplay();
  updateLanguageUI();
}

function startLevel(tier, idx) {
  if (!isLevelUnlocked(tier, idx)) return;

  currentTier = tier;
  currentLevelIdx = idx;
  
  document.getElementById('levelDisplay').innerText = idx + 1;

  document.getElementById('menuWrapper').style.display = 'none';
  
  document.getElementById('ui').style.display = 'flex';
  document.getElementById('gameContainer').style.display = 'flex';

  clearKeys();
  resetPlayer();
  isLevelTransitioning = false;
  isPlaying = true;
  updateDeathsDisplay();
  updateLanguageUI();
}

function showMenu() {
  isPlaying = false;
  clearKeys();
  initMenu();
  document.getElementById('menuWrapper').style.display = 'flex';
  document.getElementById('gameContainer').style.display = 'none';
  closeModal();
}

function openModal(title, bodyHtml, actions) {
  document.getElementById('modalTitle').innerText = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  
  const actionsContainer = document.getElementById('modalActions');
  actionsContainer.innerHTML = '';
  
  actions.forEach(action => {
    const btn = document.createElement('button');
    btn.className = action.primary ? 'modal-btn-primary' : '';
    btn.innerText = action.text;
    btn.onclick = action.onClick;
    actionsContainer.appendChild(btn);
  });

  document.getElementById('customModal').style.display = 'flex';
}

function closeModal() {
  document.getElementById('customModal').style.display = 'none';
}

function update() {
  if (!isPlaying || isLevelTransitioning) return;

  if (player.isDying) {
    player.deathTimer--;
    if (player.deathTimer <= 0) resetPlayer();
    return;
  }

  const lvl = allLevels[currentTier][currentLevelIdx];

  const currentAccel = player.isGrounded ? player.accel : player.airAccel;
  const currentFriction = player.isGrounded ? player.friction : player.airFriction;

  if (keys['ArrowRight'] || keys['KeyD']) {
    player.vx += currentAccel;
  } else if (keys['ArrowLeft'] || keys['KeyA']) {
    player.vx -= currentAccel;
  } else {
    player.vx *= currentFriction;
  }

  if (player.vx > 0.3) player.facingDir = 1;
  else if (player.vx < -0.3) player.facingDir = -1;

  if (player.vx > player.maxSpeed) player.vx = player.maxSpeed;
  if (player.vx < -player.maxSpeed) player.vx = -player.maxSpeed;

  player.x += player.vx;
  player.isTouchingWall = 0;

  for (let p of lvl.platforms) {
    if (isColliding(player.x, player.y, player.width, player.height, p)) {
      if (player.vx > 0) {
        player.x = p.x - player.width;
        player.isTouchingWall = 1;
      } else if (player.vx < 0) {
        player.x = p.x + p.w;
        player.isTouchingWall = -1;
      }
      player.vx = 0;
    }
  }

  player.vy += player.gravity;

  if (!player.isGrounded && player.isTouchingWall !== 0 && player.vy > 2) {
    player.vy = 2;
  }

  player.y += player.vy;
  player.isGrounded = false;
  for (let p of lvl.platforms) {
    if (isColliding(player.x, player.y, player.width, player.height, p)) {
      if (player.vy > 0) {
        player.y = p.y - player.height;
        player.vy = 0;
        player.isGrounded = true;
      } else if (player.vy < 0) {
        player.y = p.y + p.h;
        player.vy = 0;
      }
    }
  }

  if (keys['ArrowUp'] || keys['KeyW'] || keys['Space']) {
    if (player.isGrounded) {
      player.vy = player.jumpPower;
      player.isGrounded = false;
      playSound(400, 0.1, 'square');
    } else if (player.isTouchingWall !== 0) {
      player.vy = player.jumpPower;
      player.vx = -player.isTouchingWall * 7; 
      player.isTouchingWall = 0;
      playSound(450, 0.1, 'square');
    }
  }

  lvl.hazards.forEach(h => {
    if (isColliding(player.x, player.y, player.width, player.height, h)) {
      triggerDeath();
    }
  });

  const playerRect = { x: player.x, y: player.y, w: player.width, h: player.height };
  lvl.spikes.forEach(s => {
    if (isRectTriangleColliding(playerRect, s)) {
      triggerDeath();
    }
  });

  if (player.y > canvas.height + 50) triggerDeath();

  if (player.x + player.width >= canvas.width - 2) {
    isLevelTransitioning = true;
    playSound(800, 0.2, 'sine');
    markLevelCleared(currentTier, currentLevelIdx);
    
    if (currentLevelIdx < 4) {
      currentLevelIdx++;
      document.getElementById('levelDisplay').innerText = currentLevelIdx + 1;
      resetPlayer();
      clearKeys();
      isLevelTransitioning = false;
    } else {
      const t = i18n[currentLang];
      const currentTierIdx = tierOrder.indexOf(currentTier);

      if (currentTierIdx < tierOrder.length - 1) {
        const nextTier = tierOrder[currentTierIdx + 1];
        const tierName = document.getElementById('tierDisplay').innerText;
        
        openModal(
          t.clearTierTitle,
          t.clearTierBody(tierName, isCheatUnlocked()),
          [
            {
              text: t.nextTierBtn,
              primary: true,
              onClick: () => {
                closeModal();
                startLevel(nextTier, 0);
              }
            },
            {
              text: t.backMenuBtn,
              primary: false,
              onClick: () => {
                showMenu();
              }
            }
          ]
        );
      } else {
        playSound(1000, 0.5, 'triangle');
        openModal(
          t.victoryTitle,
          t.victoryBody(deathCount, isCheatUnlocked()),
          [
            {
              text: t.backMenuBtn,
              primary: true,
              onClick: () => {
                showMenu();
              }
            }
          ]
        );
      }
    }
  }
}

function triggerDeath() {
  if (player.isDying) return;
  player.isDying = true;
  player.deathTimer = player.maxDeathTimer;
  player.vx = 0;
  player.vy = 0;

  deathCount++;
  localStorage.setItem('appel_deaths', deathCount);
  updateDeathsDisplay();

  playSound(150, 0.3, 'sawtooth');
}

function resetPlayer() {
  const start = allLevels[currentTier][currentLevelIdx].playerStart;
  player.x = start.x;
  player.y = start.y;
  player.vx = 0;
  player.vy = 0;
  player.isGrounded = false;
  player.isTouchingWall = 0;
  player.isDying = false;
  player.deathTimer = 0;
  player.facingDir = 0;
  clearKeys();
}

function draw() {
  if (!isPlaying) return;
  const lvl = allLevels[currentTier][currentLevelIdx];
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const isLight = document.body.classList.contains('light-mode');

  lvl.platforms.forEach(p => {
    ctx.fillStyle = isLight ? '#94a3b8' : '#334155';
    ctx.fillRect(p.x, p.y, p.w, p.h);
    
    ctx.fillStyle = isLight ? '#cbd5e1' : '#475569';
    ctx.fillRect(p.x, p.y, p.w, 10);
  });

  lvl.hazards.forEach(h => {
    ctx.fillStyle = h.color;
    ctx.fillRect(h.x, h.y, h.w, h.h);
  });

  ctx.fillStyle = '#38bdf8';
  lvl.spikes.forEach(s => {
    ctx.beginPath();
    if (s.dir === 'up') {
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(s.x + s.w / 2, s.y - s.h);
      ctx.lineTo(s.x + s.w, s.y);
    } else if (s.dir === 'left') {
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(s.x - s.w, s.y + s.h / 2);
      ctx.lineTo(s.x, s.y + s.h);
    }
    ctx.closePath();
    ctx.fill();
  });

  ctx.save();
  if (player.isDying) {
    const progress = player.deathTimer / player.maxDeathTimer;
    const alpha = Math.max(0, progress);
    const scale = Math.max(0.1, progress);

    ctx.globalAlpha = alpha;
    const centerX = player.x + player.width / 2;
    const centerY = player.y + player.height / 2;
    ctx.translate(centerX, centerY);
    ctx.scale(scale, scale);
    ctx.translate(-centerX, -centerY);
  }

  ctx.fillStyle = isLight ? '#0f172a' : '#f8fafc';
  ctx.beginPath();
  ctx.roundRect(player.x, player.y, player.width, player.height, 6);
  ctx.fill();

  let eyeOffsetX = 18;
  let pupilOffsetX = 20;

  if (player.facingDir === 1) {
    eyeOffsetX = 20;
    pupilOffsetX = 23;
  } else if (player.facingDir === -1) {
    eyeOffsetX = 8;
    pupilOffsetX = 5;
  }

  ctx.fillStyle = isLight ? '#ffffff' : '#0f172a';
  ctx.beginPath();
  ctx.arc(player.x + eyeOffsetX, player.y + 14, 7, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = isLight ? '#0f172a' : '#ffffff';
  ctx.beginPath();
  ctx.arc(player.x + pupilOffsetX, player.y + 14, 3, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

window.addEventListener('resize', checkMobileDevice);

initMenu();
gameLoop();
