<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>驗證進入 - MLB 抽卡遊戲</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0f111a;
            color: #ffffff;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
        }

        .top-nav {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .nav-btn {
            background-color: #1a1d2d;
            border: 1px solid #2a2e45;
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .nav-btn:hover {
            background-color: #2a2e45;
            border-color: #8b5cf6;
        }

        .auth-card {
            background-color: #1a1d2d;
            border: 1px solid #2a2e45;
            border-radius: 20px;
            padding: 40px 30px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-top: 40px;
        }

        .auth-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .auth-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .auth-desc {
            font-size: 14px;
            color: #a0a5c0;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        .password-input {
            flex: 1;
            padding: 12px 16px;
            font-size: 18px;
            border-radius: 10px;
            border: 1px solid #3b3f5c;
            background-color: #0f111a;
            color: #ffffff;
            outline: none;
            letter-spacing: 3px;
        }

        .password-input:focus {
            border-color: #8b5cf6;
        }

        .submit-btn {
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            border: none;
            background-color: #8b5cf6;
            color: white;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color 0.2s;
        }

        .submit-btn:hover {
            background-color: #7c3aed;
        }

        .error-msg {
            font-size: 13px;
            margin-top: 12px;
            display: none;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="top-nav">
        <a href="index.html" class="nav-btn">
            <span>←</span> <span id="btnHomeText">回首頁</span>
        </a>
        <button class="nav-btn" onclick="toggleLanguage()">
            🌐 <span id="langBtnText">English</span>
        </button>
    </div>

    <div class="auth-card">
        <div class="auth-icon">🔒</div>
        <div class="auth-title" id="authTitle">MLB 專區</div>
        <div class="auth-desc" id="authDesc">
            遊戲資源尚未做得很完善，因此需要密碼才能進入。<br>
            請輸入密碼後按「進入」。
        </div>

        <div class="input-group">
            <input type="password" id="passInput" class="password-input" placeholder="••••••••" onkeydown="if(event.key==='Enter') checkPassword()">
            <button class="submit-btn" onclick="checkPassword()" id="submitBtn">進入 →</button>
        </div>
        <div id="errorMsg" class="error-msg"></div>
    </div>

    <script src="mlbcard.js"></script>

    <script>
        const translations = {
            'zh': {
                pageTitle: "驗證進入 - MLB 抽卡遊戲",
                btnHome: "回首頁",
                langBtn: "English",
                authTitle: "MLB 專區",
                authDesc: "遊戲資源尚未做得很完善，因此需要密碼才能進入。<br>請輸入密碼後按「進入」。",
                submitBtn: "進入 →",
                errTrap1: "🎉 抓到了！你是不是開了 F12 解密？可惜這是假的密碼，改變你的想法吧！",
                errTrap2: "💡 沒錯，Base64 確實不是加密，但這裡的答案也不是這個！",
                errTrap3: "🤡 恭喜你找到 mlbcard.js 裡的誘餌！它都說它是假密碼了啦～",
                errDefault: "密碼錯誤，請重新輸入！"
            },
            'en': {
                pageTitle: "Authentication - MLB Card Game",
                btnHome: "Home",
                langBtn: "中文",
                authTitle: "MLB Area",
                authDesc: "Game resources are not yet fully completed, so a password is required to enter.<br>Please enter the password and press 'Enter'.",
                submitBtn: "Enter →",
                errTrap1: "🎉 Caught you! Did you open DevTools to decrypt? Too bad this is a fake password!",
                errTrap2: "💡 You're right, Base64 is not encryption, but that's not the answer here either!",
                errTrap3: "🤡 Congrats on finding the bait in mlbcard.js! It says it's a fake password right there~",
                errDefault: "Incorrect password, please try again!"
            }
        };

        let currentLang = 'zh';
        let currentErrorType = null;

        function toggleLanguage() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            const t = translations[currentLang];

            document.title = t.pageTitle;
            document.getElementById('btnHomeText').innerText = t.btnHome;
            document.getElementById('langBtnText').innerText = t.langBtn;
            document.getElementById('authTitle').innerText = t.authTitle;
            document.getElementById('authDesc').innerHTML = t.authDesc;
            document.getElementById('submitBtn').innerText = t.submitBtn;

            if (currentErrorType) {
                const errorMsg = document.getElementById('errorMsg');
                errorMsg.innerText = t[currentErrorType];
            }
        }

        const _0x9a2b = [
            "Y2hhbmdlX3lvdXJfTWluZF9Ob3dfOik=", 
            "b2h0YW5paXNnb2F0",               
            "YmFzZTY0X2lzX25vdF9lbmNyeXB0aW9u", 
            "aWFtYWZha2VwYXNzd29yZA=="          
        ];

        const _0x4e2c = _0x9a2b[1]; 

        function checkPassword() {
            const inputVal = document.getElementById('passInput').value;
            const errorMsg = document.getElementById('errorMsg');
            const encodedInput = btoa(inputVal); 
            const t = translations[currentLang];

            if (encodedInput === _0x4e2c) {
                window.location.href = 'mlbcard.html';
                return;
            }

            errorMsg.style.display = 'block';

            if (encodedInput === _0x9a2b[0]) {
                errorMsg.style.color = "#ffb703";
                currentErrorType = 'errTrap1';
            } else if (encodedInput === _0x9a2b[2]) {
                errorMsg.style.color = "#00b4d8";
                currentErrorType = 'errTrap2';
            } else if (encodedInput === _0x9a2b[3]) {
                errorMsg.style.color = "#ff4d6d";
                currentErrorType = 'errTrap3';
            } else {
                errorMsg.style.color = "#ff5252";
                currentErrorType = 'errDefault';
            }

            errorMsg.innerText = t[currentErrorType];
            document.getElementById('passInput').value = '';
        }
    </script>
</body>
</html>
