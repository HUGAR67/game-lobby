<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>驗證進入 - MLB 抽卡遊戲</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0f111a;
            color: #ffffff;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .auth-card {
            background-color: #1a1d2d;
            border: 1px solid #2a2e45;
            border-radius: 20px;
            padding: 40px 30px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .auth-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .auth-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .auth-desc {
            font-size: 14px;
            color: #a0a5c0;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        .password-input {
            flex: 1;
            padding: 12px 16px;
            font-size: 18px;
            border-radius: 10px;
            border: 1px solid #3b3f5c;
            background-color: #0f111a;
            color: #ffffff;
            outline: none;
            letter-spacing: 3px;
        }

        .password-input:focus {
            border-color: #8b5cf6;
        }

        .submit-btn {
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            border: none;
            background-color: #8b5cf6;
            color: white;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color 0.2s;
        }

        .submit-btn:hover {
            background-color: #7c3aed;
        }

        .error-msg {
            font-size: 13px;
            margin-top: 12px;
            display: none;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<!-- 抓 偷開F12找密碼 -->

    <div class="auth-card">
        <div class="auth-icon">🔒</div>
        <div class="auth-title">MLB 專區</div>
        <div class="auth-desc">
            遊戲資源為專屬體驗，需要密碼才能進入。<br>
            請輸入密碼後按「進入」。
        </div>

        <div class="input-group">
            <input type="password" id="passInput" class="password-input" placeholder="••••••••" onkeydown="if(event.key==='Enter') checkPassword()">
            <button class="submit-btn" onclick="checkPassword()">進入 →</button>
        </div>
        <div id="errorMsg" class="error-msg"></div>
    </div>

    <script src="mlbcard.js"></script>

    <script>
        const _0x9a2b = [
            "Y2hhbmdlX3lvdXJfTWluZF9Ob3dfOik=", 
            "b2h0YW5paXNnb2F0",               
            "YmFzZTY0X2lzX25vdF9lbmNyeXB0aW9u", 
            "aWFtYWZha2VwYXNzd29yZA=="          
        ];

        const _0x4e2c = _0x9a2b[1]; 

        function _decryptToken(_0x3c) {
            console.warn("[System Alert] Initializing security protocol...");
            console.log("Decoding authentication token... 0%");
            setTimeout(() => console.log("Decoding authentication token... 35%"), 1000);
            setTimeout(() => console.log("Decoding authentication token... 78%"), 2000);
            setTimeout(() => console.log("Decoding authentication token... 99%"), 3000);
            setTimeout(() => console.warn("Access Denied: Key verification failed."), 4000);
        }

        console.log("%cSystem Protection Active.", "color: #8b5cf6; font-size: 14px; font-weight: bold;");

        function checkPassword() {
            const inputVal = document.getElementById('passInput').value;
            const errorMsg = document.getElementById('errorMsg');
            const encodedInput = btoa(inputVal); 

            if (encodedInput === _0x4e2c) {
                window.location.href = 'mlbcard.html';
                return;
            }

            errorMsg.style.display = 'block';

            if (encodedInput === _0x9a2b[0]) {
                errorMsg.style.color = "#ffb703";
                errorMsg.innerText = "🎉 抓到了！你是不是開了 F12 解密？可惜這是假的密碼，改變你的想法吧！";
            } else if (encodedInput === _0x9a2b[2]) {
                errorMsg.style.color = "#00b4d8";
                errorMsg.innerText = "💡 沒錯，Base64 確實不是加密，但這裡的答案也不是這個！";
            } else if (encodedInput === _0x9a2b[3]) {
                errorMsg.style.color = "#ff4d6d";
                errorMsg.innerText = "🤡 恭喜你找到 mlbcard.js 裡的誘餌！它都說它是假密碼了啦～";
            } else {
                errorMsg.style.color = "#ff5252";
                errorMsg.innerText = "密碼錯誤，請重新輸入！";
            }

            document.getElementById('passInput').value = '';
        }
    </script>
</body>
</html>
