<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MLB Ultimate Card Pack Simulator</title>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Orbitron:wght@600;800;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #07090e;
      --panel-bg: rgba(15, 23, 42, 0.75);
      --panel-border: rgba(255, 255, 255, 0.12);
      --accent-neon: #00f0ff;
      --accent-gold: #ffb703;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      
      /* Rarities Color Scheme */
      --grad-ssr: linear-gradient(135deg, #ff0055 0%, #ff5000 50%, #ffcc00 100%);
      --grad-sr: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
      --grad-r: linear-gradient(135deg, #00d2ff 0%, #3b82f6 100%);
      --grad-a: linear-gradient(135deg, #10b981 0%, #059669 100%);
      --grad-b: linear-gradient(135deg, #64748b 0%, #334155 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% -10%, rgba(0, 240, 255, 0.15), transparent 60%),
        radial-gradient(circle at 90% 90%, rgba(255, 0, 85, 0.08), transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 40px 20px;
    }

    .wrapper {
      max-width: 1280px;
      margin: 0 auto;
    }

    /* Header */
    header {
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      padding: 24px 32px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 32px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    .brand h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #ffffff 0%, var(--accent-neon) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .brand p {
      color: var(--text-muted);
      font-size: 0.85rem;
      letter-spacing: 1px;
      margin-top: 4px;
      text-transform: uppercase;
    }

    .user-stats {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .coin-badge {
      background: rgba(255, 183, 3, 0.1);
      border: 1px solid rgba(255, 183, 3, 0.4);
      padding: 10px 22px;
      border-radius: 50px;
      color: var(--accent-gold);
      font-family: 'Orbitron', sans-serif;
      font-weight: 800;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 0 20px rgba(255, 183, 3, 0.15);
    }

    /* Buttons */
    .btn {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 14px 28px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #00f0ff 0%, #0072ff 100%);
      color: #000;
      box-shadow: 0 8px 20px rgba(0, 240, 255, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(0, 240, 255, 0.5);
    }

    .btn-secondary {
      background: linear-gradient(135deg, #ff0055 0%, #990033 100%);
      color: #fff;
      box-shadow: 0 8px 20px rgba(255, 0, 85, 0.3);
    }

    .btn-secondary:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(255, 0, 85, 0.5);
    }

    .btn-claim {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #fff;
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
    }

    .btn-reset {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--panel-border);
      color: var(--text-muted);
      padding: 10px 18px;
      font-size: 0.75rem;
    }
    
    .btn-reset:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .controls-panel {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 40px;
    }

    /* Section Titles */
    .section-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 40px 0 24px 0;
    }

    .section-header h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.4rem;
      letter-spacing: 2px;
      color: var(--text-main);
      text-transform: uppercase;
    }

    .section-header .line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--panel-border) 0%, transparent 100%);
    }

    /* Filters */
    .filter-bar {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .filter-bar input, .filter-bar select {
      background: rgba(7, 9, 14, 0.6);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 12px 16px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .filter-bar input { flex: 2; min-width: 220px; }
    .filter-bar select { flex: 1; min-width: 160px; }

    .filter-bar input:focus, .filter-bar select:focus {
      border-color: var(--accent-neon);
    }

    /* Card Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 20px;
      min-height: 180px;
    }

    /* Card UI */
    .card {
      background: linear-gradient(180deg, rgba(30, 41, 59, 0.6) 0%, rgba(15, 23, 42, 0.9) 100%);
      border-radius: 16px;
      border: 1px solid var(--panel-border);
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 290px;
      position: relative;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      animation: cardAppear 0.4s ease-out;
    }

    @keyframes cardAppear {
      from { transform: scale(0.85) translateY(20px); opacity: 0; }
      to { transform: scale(1) translateY(0); opacity: 1; }
    }

    .card:hover {
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 20px 30px rgba(0, 0, 0, 0.6);
    }

    /* Rarities Styling */
    .rarity-SSR { border-color: rgba(255, 0, 85, 0.6); box-shadow: 0 0 15px rgba(255, 0, 85, 0.15); }
    .rarity-SR  { border-color: rgba(168, 85, 247, 0.5); }
    .rarity-R   { border-color: rgba(0, 212, 255, 0.4); }
    .rarity-A   { border-color: rgba(16, 185, 129, 0.3); }
    .rarity-B   { border-color: rgba(100, 116, 139, 0.2); }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge-rarity {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      font-weight: 900;
      padding: 2px 8px;
      border-radius: 6px;
      color: #000;
    }

    .rarity-SSR .badge-rarity { background: var(--grad-ssr); color: #fff; }
    .rarity-SR .badge-rarity  { background: var(--grad-sr); color: #fff; }
    .rarity-R .badge-rarity   { background: var(--grad-r); color: #000; }
    .rarity-A .badge-rarity   { background: var(--grad-a); color: #fff; }
    .rarity-B .badge-rarity   { background: var(--grad-b); color: #fff; }

    .badge-level {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(0, 0, 0, 0.4);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .team-emblem {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.2rem;
      font-weight: 900;
      text-align: center;
      margin: 10px 0;
      background: linear-gradient(180deg, #ffffff 0%, rgba(255,255,255,0.2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
    }

    .player-details {
      text-align: center;
    }

    .player-name {
      font-weight: 800;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #fff;
    }

    .player-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .stats-box {
      background: rgba(0, 0, 0, 0.4);
      border-radius: 8px;
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      font-size: 0.75rem;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .ovr-val {
      font-family: 'Orbitron', sans-serif;
      font-weight: 800;
      color: var(--accent-gold);
    }

    .card-actions {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }

    .act-btn {
      flex: 1;
      padding: 6px 0;
      border-radius: 6px;
      border: none;
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
      color: #fff;
      transition: opacity 0.2s;
    }
    .act-btn:hover { opacity: 0.85; }
    .act-sell { background: #e11d48; }
    .act-upgrade { background: #2563eb; }

    .locked {
      opacity: 0.25;
      filter: grayscale(100%);
    }
    .locked:hover { transform: none; box-shadow: none; }

    .empty-msg {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--text-muted);
      padding: 40px;
      font-size: 0.95rem;
    }
  </style>
</head>

    let userCoins = 100;

    function saveGameData() {
      const saveData = {
        coins: userCoins,
        cardsData: cards.map(c => ({ id: c.id, count: c.count, level: c.level }))
      };
      localStorage.setItem("mlb_card_game_v2", JSON.stringify(saveData));
    }

    function loadGameData() {
      const saved = localStorage.getItem("mlb_card_game_v2");
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (parsed.coins !== undefined) userCoins = parsed.coins;
          if (parsed.cardsData && Array.isArray(parsed.cardsData)) {
            parsed.cardsData.forEach(savedCard => {
              const target = cards.find(c => c.id === savedCard.id);
              if (target) {
                target.count = savedCard.count || 0;
                target.level = savedCard.level || 1;
              }
            });
          }
        } catch (e) { console.error("Error loading save data:", e); }
      }
    }

    function resetGameData() {
      if (confirm("Are you sure you want to reset all game data?")) {
        localStorage.removeItem("mlb_card_game_v2");
        location.reload();
      }
    }

    function updateCoinsDisplay() {
      document.getElementById("coinCount").innerText = userCoins;
    }

    function checkBankruptcy() {
      const freeBtn = document.getElementById("freeCoinsBtn");
      const hasDuplicates = cards.some(c => c.count > 1);

      if (userCoins < 10 && !hasDuplicates) {
        freeBtn.style.display = "inline-flex";
      } else {
        freeBtn.style.display = "none";
      }
    }

    function claimFreeCoins() {
      userCoins += 50;
      updateCoinsDisplay();
      checkBankruptcy();
      saveGameData();
    }

    function getRandomCard() {
      const rand = Math.random() * 100;
      let targetRarity = "B";

      if (rand < rarityRates.SSR) targetRarity = "SSR";
      else if (rand < rarityRates.SR) targetRarity = "SR";
      else if (rand < rarityRates.R) targetRarity = "R";
      else if (rand < rarityRates.A) targetRarity = "A";

      const pool = cards.filter(c => c.rarity === targetRarity);
      return pool[Math.floor(Math.random() * pool.length)];
    }

    function drawCards(amount) {
      const cost = amount * 10;
      if (userCoins < cost) {
        alert("Not enough coins!");
        return;
      }

      userCoins -= cost;
      updateCoinsDisplay();

      const drawArea = document.getElementById("drawArea");
      drawArea.innerHTML = "";

      for (let i = 0; i < amount; i++) {
        const pulled = getRandomCard();
        pulled.count++;
        const cardElement = createCardUI(pulled, false);
        drawArea.appendChild(cardElement);
      }

      renderAlbum();
      checkBankruptcy();
      saveGameData();
    }

    function convertToCoins(cardId) {
      const card = cards.find(c => c.id === cardId);
      if (card && card.count > 1) {
        card.count--;
        userCoins += card.value;
        updateCoinsDisplay();
        renderAlbum();
        refreshDrawArea();
        checkBankruptcy();
        saveGameData();
      }
    }

    function upgradeCard(cardId) {
      const card = cards.find(c => c.id === cardId);
      const upgradeCost = card.value;

      if (!card || card.count <= 1) {
        alert("You need at least 1 duplicate card to upgrade!");
        return;
      }
      if (card.level >= 10) {
        alert("Card reached maximum level (Lv.10)!");
        return;
      }
      if (userCoins < upgradeCost) {
        alert(`Upgrade requires ${upgradeCost} coins!`);
        return;
      }

      card.count--;
      userCoins -= upgradeCost;
      card.level++;

      updateCoinsDisplay();
      renderAlbum();
      refreshDrawArea();
      checkBankruptcy();
      saveGameData();
    }

    function refreshDrawArea() {
      const currentDraws = document.getElementById("drawArea").querySelectorAll('.card');
      currentDraws.forEach(el => {
        const cardId = parseInt(el.dataset.id);
        const cardData = cards.find(c => c.id === cardId);
        if (cardData) {
          const newUI = createCardUI(cardData, false);
          el.replaceWith(newUI);
        }
      });
    }

    function createCardUI(cardData, isAlbum = false) {
      const cardDiv = document.createElement("div");
      const isLocked = isAlbum && cardData.count === 0;
      
      cardDiv.className = `card rarity-${cardData.rarity} ${isLocked ? 'locked' : ''}`;
      cardDiv.dataset.id = cardData.id;

      const canAct = cardData.count > 1;
      const currentOvr = cardData.baseOvr + (cardData.level - 1) * cardData.levelStep;
      const isMaxLevel = cardData.level >= 10;

      cardDiv.innerHTML = `
        <div class="card-head">
          <span class="badge-rarity">${cardData.rarity}</span>
          <span class="badge-level">Lv.${cardData.level} (x${cardData.count})</span>
        </div>
        <div class="team-emblem">${cardData.team}</div>
        <div class="player-details">
          <div class="player-name">${cardData.name}</div>
          <div class="player-sub">${cardData.team} • #${cardData.number}</div>
        </div>
        <div class="stats-box">
          <span>POS: ${cardData.pos}</span>
          <span class="ovr-val">OVR ${currentOvr}</span>
        </div>
        ${canAct ? `
          <div class="card-actions">
            <button class="act-btn act-sell" onclick="convertToCoins(${cardData.id})">Sell (+${cardData.value})</button>
            <button class="act-btn act-upgrade" onclick="upgradeCard(${cardData.id})">${isMaxLevel ? 'MAX' : `UP (-${cardData.value})`}</button>
          </div>
        ` : ''}
      `;

      return cardDiv;
    }

    function renderAlbum() {
      const albumArea = document.getElementById("albumArea");
      albumArea.innerHTML = "";

      const searchVal = document.getElementById("searchInput").value.toLowerCase();
      const rarityVal = document.getElementById("rarityFilter").value;
      const sortVal = document.getElementById("sortFilter").value;

      let filteredCards = cards.filter(card => {
        const matchesSearch = card.name.toLowerCase().includes(searchVal) || 
                              card.team.toLowerCase().includes(searchVal) ||
                              `#${card.number}`.includes(searchVal);
        const matchesRarity = (rarityVal === "ALL") || (card.rarity === rarityVal);
        return matchesSearch && matchesRarity;
      });

      filteredCards.sort((a, b) => {
        const ovrA = a.baseOvr + (a.level - 1) * a.levelStep;
        const ovrB = b.baseOvr + (b.level - 1) * b.levelStep;

        switch (sortVal) {
          case "OWNED_FIRST":
            if ((a.count > 0) !== (b.count > 0)) {
              return b.count > 0 ? 1 : -1;
            }
            return a.id - b.id;

          case "UNOWNED_FIRST":
            if ((a.count === 0) !== (b.count === 0)) {
              return b.count === 0 ? 1 : -1;
            }
            return a.id - b.id;

          case "TEAM":
            if (a.team !== b.team) {
              return a.team.localeCompare(b.team);
            }
            return a.id - b.id;

          case "OVR_DESC":
            return ovrB - ovrA;

          case "RARITY_DESC":
            if (rarityRank[b.rarity] !== rarityRank[a.rarity]) {
              return rarityRank[b.rarity] - rarityRank[a.rarity];
            }
            return ovrB - ovrA;

          case "DEFAULT":
          default:
            return a.id - b.id;
        }
      });

      if (filteredCards.length === 0) {
        albumArea.innerHTML = `<div class="empty-msg">No players matching criteria found.</div>`;
        return;
      }

      filteredCards.forEach(card => {
        const cardElement = createCardUI(card, true);
        albumArea.appendChild(cardElement);
      });
    }

    loadGameData();
    updateCoinsDisplay();
    renderAlbum();
    checkBankruptcy();
  </script>
