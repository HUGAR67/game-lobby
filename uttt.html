<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>終極圈圈叉叉</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --text-color: #222222;
            --card-bg: #ffffff;
            --border-color: #cccccc;
            --primary-btn: #4caf50;
            --primary-btn-hover: #45a049;
            --board-bg: #111111;
            --big-cell-bg: #e0e0e0;
            --small-cell-bg: #ffffff;
            --panel-bg: #ffffff;
            --footer-color: #777777;
        }

        body.dark-mode {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --card-bg: #1e1e1e;
            --border-color: #444444;
            --primary-btn: #388e3c;
            --primary-btn-hover: #2e7d32;
            --board-bg: #000000;
            --big-cell-bg: #222222;
            --small-cell-bg: #333333;
            --panel-bg: #1e1e1e;
            --footer-color: #aaaaaa;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 10px;
            padding: 0;
            min-height: 98vh;
            transition: background-color 0.3s, color 0.3s;
        }

        .controls {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 900px;
        }

        select, button, input {
            padding: 6px 12px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-color);
            cursor: pointer;
        }

        button { background-color: var(--primary-btn); color: white; border: none; }
        button:hover { background-color: var(--primary-btn-hover); }

        .btn-lang { background-color: #ff9800; }
        .btn-theme { background-color: #9c27b0; }
        .btn-rule { background-color: #2196F3; }
        .btn-home { background-color: #607d8b; }
        .btn-danger { background-color: #f44336; }

        .header { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 900px; margin-bottom: 12px; }

        #status-container { display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: bold; margin-bottom: 10px; flex-wrap: wrap; justify-content: center; }
        .player-badge { padding: 4px 10px; border-radius: 20px; color: white; font-size: 14px; }
        .player-badge.x-turn { background-color: #e53935; }
        .player-badge.o-turn { background-color: #1e88e5; }

        .score-board {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 6px 16px;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        .ultimate-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 1.5vw;
            background-color: var(--board-bg);
            padding: 1.5vw;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            width: 92vw;
            max-width: 440px;
            aspect-ratio: 1 / 1;
        }

        .big-cell {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 1vw;
            background-color: var(--big-cell-bg);
            padding: 1vw;
            border-radius: 6px;
            position: relative;
            aspect-ratio: 1 / 1;
            transition: all 0.3s ease;
        }

        @keyframes pulseGlowRed {
            0% { box-shadow: 0 0 4px #ef5350, inset 0 0 0 2px #e53935; }
            50% { box-shadow: 0 0 12px #ef5350, inset 0 0 0 2px #e53935; }
            100% { box-shadow: 0 0 4px #ef5350, inset 0 0 0 2px #e53935; }
        }

        @keyframes pulseGlowBlue {
            0% { box-shadow: 0 0 4px #42a5f5, inset 0 0 0 2px #1e88e5; }
            50% { box-shadow: 0 0 12px #42a5f5, inset 0 0 0 2px #1e88e5; }
            100% { box-shadow: 0 0 4px #42a5f5, inset 0 0 0 2px #1e88e5; }
        }

        .ultimate-board.turn-x .big-cell.active { animation: pulseGlowRed 1.5s infinite; }
        .ultimate-board.turn-o .big-cell.active { animation: pulseGlowBlue 1.5s infinite; }

        .small-cell {
            width: 100%;
            height: 100%;
            aspect-ratio: 1 / 1;
            background-color: var(--small-cell-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5vw;
            font-weight: bold;
            cursor: pointer;
            border-radius: 3px;
            user-select: none;
            color: var(--text-color);
            transition: background-color 0.2s;
        }

        @media (min-width: 500px) {
            .ultimate-board { gap: 8px; padding: 8px; }
            .big-cell { gap: 4px; padding: 4px; }
            .small-cell { font-size: 22px; }
        }

        .small-cell.taken { cursor: not-allowed; }
        .small-cell.x { color: #e53935; animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .small-cell.o { color: #1e88e5; animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .big-cell-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255, 255, 255, 0.92);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15vw;
            font-weight: bold;
            border-radius: 6px;
            pointer-events: none;
            animation: overlayPop 0.3s ease-out;
            z-index: 5;
        }

        @keyframes overlayPop {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @media (min-width: 500px) { .big-cell-overlay { font-size: 70px; } }
        body.dark-mode .big-cell-overlay { background-color: rgba(30, 30, 30, 0.92); }
        .big-cell-overlay.x { color: #e53935; }
        .big-cell-overlay.o { color: #1e88e5; }

        .demo-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(0,0,0,0.15);
            border-radius: 8px;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid var(--border-color);
        }

        .demo-status {
            font-size: 12px;
            font-weight: bold;
            color: #ffb74d;
            margin-bottom: 6px;
            text-align: center;
            min-height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .demo-board {
            width: 180px;
            height: 180px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 4px;
            background-color: #000000;
            padding: 4px;
            border-radius: 6px;
        }

        .demo-big-cell {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 1px;
            background-color: #222222;
            padding: 1px;
            border-radius: 3px;
            position: relative;
            transition: all 0.3s;
        }

        .demo-big-cell.active-target {
            border: 1px solid #ffb74d;
            box-shadow: 0 0 8px rgba(255, 183, 77, 0.8);
            background-color: #332b18;
        }

        .demo-small-cell {
            background-color: #333333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            border-radius: 1px;
        }

        .demo-small-cell.x { color: #e53935; }
        .demo-small-cell.o { color: #1e88e5; }

        .demo-big-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(30,30,30,0.92);
            color: #e53935;
            font-size: 32px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 3px;
            animation: overlayPop 0.3s ease-out;
        }

        .modal {
            display: flex;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--card-bg);
            color: var(--text-color);
            padding: 20px;
            border-radius: 12px;
            max-width: 420px;
            width: 90%;
            position: relative;
            border: 1px solid var(--border-color);
        }

        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 22px; font-weight: bold; cursor: pointer; }

        footer {
            margin-top: auto;
            padding: 20px 0 10px 0;
            font-size: 12px;
            color: var(--footer-color);
            text-align: center;
            width: 100%;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body class="dark-mode">

    <div class="header">
        <button class="btn-home" onclick="window.location.href='index.html'" data-i18n="home">🏠 主選單</button>
        <span id="header-title" style="font-weight: bold; font-size: 16px;" data-i18n="appTitle">❌⭕ 終極圈圈叉叉</span>
        <div style="display: flex; gap: 6px;">
            <button class="btn-lang" onclick="toggleLanguage()" id="lang-btn">English</button>
            <button class="btn-theme" id="theme-btn" onclick="toggleDarkMode()">☀️ 淺色</button>
        </div>
    </div>

    <div class="controls">
        <select id="uttt-mode" onchange="onUTTTModeChange()">
            <option value="pvp" data-i18n="modePvp">雙人對戰</option>
            <option value="pve" selected data-i18n="modePve">單人對戰 (AI)</option>
        </select>
        <select id="ai-level" onchange="resetUTTT()">
            <option value="easy" data-i18n="aiEasy">AI: 入門</option>
            <option value="normal" data-i18n="aiNormal">AI: 進攻</option>
            <option value="hard" selected data-i18n="aiHard">AI: 大師 (Minimax)</option>
        </select>
        <button class="btn-rule" onclick="openUTTTRule()" data-i18n="ruleBtn">說明</button>
        <button onclick="resetUTTT()" data-i18n="resetBtn">重來</button>
    </div>

    <div id="ai-score-container" class="score-board">
        <span data-i18n="aiStatTitle">🤖 對決 AI 的戰績：</span>
        <span style="color:#4caf50;"><span data-i18n="statWinText">勝</span>: <span id="stat-win">0</span></span>
        <span style="color:#f44336;"><span data-i18n="statLossText">敗</span>: <span id="stat-loss">0</span></span>
        <span style="color:#ff9800;"><span data-i18n="statDrawText">和</span>: <span id="stat-draw">0</span></span>
        <button onclick="resetStats()" style="padding: 2px 6px; font-size: 11px; margin-left: 5px;" class="btn-danger" data-i18n="resetStatsBtn">重置</button>
    </div>

    <div id="status-container">
        <span data-i18n="turnPrefix">輪到：</span><span id="player-badge" class="player-badge x-turn">玩家 1 (X)</span>
        <span id="target-text">— 自由下棋</span>
    </div>

    <div class="ultimate-board turn-x" id="board"></div>

    <!-- 規則說明彈窗 -->
    <div class="modal" id="rule-modal-uttt" style="display: none;">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('rule-modal-uttt')">&times;</span>
            <h3 style="text-align: center; margin-top:0;" data-i18n="utttRuleTitle">終極圈圈叉叉規則</h3>
            <div class="demo-container">
                <div class="demo-status" id="demo-status-text">載入動畫中...</div>
                <div class="demo-board" id="demo-board"></div>
            </div>
            <ol style="padding-left: 20px; font-size: 12px; line-height: 1.5; margin-bottom: 10px;" id="uttt-rule-list"></ol>
            <button onclick="closeModal('rule-modal-uttt')" style="width:100%;" data-i18n="gotIt">懂了！</button>
        </div>
    </div>

    <!-- 勝利彈窗 -->
    <div class="modal" id="win-modal" style="display: none;">
        <div class="modal-content" style="text-align:center;">
            <span class="close-btn" onclick="closeModal('win-modal')">&times;</span>
            <h2 data-i18n="gameOver">🏆 遊戲結束！</h2>
            <div id="winner-message" style="font-size:18px; color:#2e7d32; margin:15px 0; font-weight:bold;"></div>
            <button onclick="closeModal('win-modal')" style="width:100%;" data-i18n="okBtn">確定</button>
        </div>
    </div>

    <footer>
        Copyright © 2026 Gemini. All Rights Reserved.
    </footer>

    <script>
        let aiStats = JSON.parse(localStorage.getItem('uttt_ai_stats')) || { wins: 0, losses: 0, draws: 0 };
        let currentLang = 'zh';

        const i18nData = {
            zh: {
                home: "🏠 主選單", appTitle: "❌⭕ 終極圈圈叉叉",
                modePvp: "雙人對戰", modePve: "單人對戰 (AI)",
                aiEasy: "AI: 入門", aiNormal: "AI: 進攻", aiHard: "AI: 大師 (Minimax)",
                ruleBtn: "說明", resetBtn: "重來",
                aiStatTitle: "🤖 對決 AI 的戰績：", statWinText: "勝", statLossText: "敗", statDrawText: "和", resetStatsBtn: "重置",
                turnPrefix: "輪到：", freeMove: "— 自由下棋", limitSector: "— 限大區塊 ",
                p1: "玩家 1 (X)", p2: "玩家 2 (O)", player: "玩家 (X)", ai: "電腦 (O)...",
                utttRuleTitle: "終極圈圈叉叉規則", gotIt: "懂了！", gameOver: "🏆 遊戲結束！", okBtn: "確定",
                winPvpX: "🎉 玩家 1 (紅色 X) 獲勝！", winPvpO: "🎉 玩家 2 (藍色 O) 獲勝！", winPvePlayer: "恭喜你贏了 AI！ 🎉", winPveAi: "電腦獲勝！ 🤖", winDraw: "🤝 平手！平分秋色！",
                utttRules: ["大棋盤由 9 個「大格子」組成，每個裡面有 9 個「小格子」。", "你在某個小格子的位置，將決定對手下一手<strong>必須在哪個大格子</strong>落子。", "率先在大棋盤連成一條線的玩家獲勝！"],
                demoSteps: [
                    "1. 🔴 X 下在中央區塊的【右上角】",
                    "2. 🔵 O 被限制只能下在【右上角大區】！",
                    "3. 🔵 O 下左下角，把 🔴 X 引導至【左下角大區】",
                    "4. 🔴 X 率先在中央區塊連成 3 子，奪下該區！",
                    "🏆 率先在 9 大格連成一條線的玩家獲勝！"
                ]
            },
            en: {
                home: "🏠 Home", appTitle: "❌⭕ Ultimate Tic-Tac-Toe",
                modePvp: "2 Players", modePve: "Vs AI",
                aiEasy: "AI: Easy", aiNormal: "AI: Normal", aiHard: "AI: Master (Minimax)",
                ruleBtn: "Rules", resetBtn: "Reset",
                aiStatTitle: "🤖 VS AI Stats: ", statWinText: "Win", statLossText: "Loss", statDrawText: "Draw", resetStatsBtn: "Reset",
                turnPrefix: "Turn: ", freeMove: "— Any Board", limitSector: "— Target Board ",
                p1: "Player 1 (X)", p2: "Player 2 (O)", player: "Player (X)", ai: "AI Thinking (O)...",
                utttRuleTitle: "Ultimate Tic-Tac-Toe Rules", gotIt: "Got it!", gameOver: "🏆 Game Over!", okBtn: "OK",
                winPvpX: "🎉 Player 1 (Red X) Wins!", winPvpO: "🎉 Player 2 (Blue O) Wins!", winPvePlayer: "You beat the AI! 🎉", winPveAi: "AI Wins! 🤖", winDraw: "🤝 It's a Draw!",
                utttRules: ["The board consists of 9 local boards, each with 9 cells.", "Your move determines which local board your opponent must play in next.", "Win 3 local boards in a row to win the whole game!"],
                demoSteps: [
                    "1. 🔴 X plays in the top-right cell of the center board",
                    "2. 🔵 O is forced to play in the Top-Right local board!",
                    "3. 🔵 O plays bottom-left, sending 🔴 X to the Bottom-Left board",
                    "4. 🔴 X gets 3-in-a-row and claims the center board!",
                    "🏆 Win 3 local boards in a row to win the game!"
                ]
            }
        };

        function toggleLanguage() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            document.getElementById('lang-btn').textContent = currentLang === 'zh' ? 'English' : '繁體中文';
            updateUI();
        }

        function updateUI() {
            const lang = i18nData[currentLang];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (lang[key]) el.textContent = lang[key];
            });
            document.getElementById('uttt-rule-list').innerHTML = lang.utttRules.map(r => `<li>${r}</li>`).join('');
            updateUTTTStatus();
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            document.getElementById('theme-btn').textContent = isDark ? '☀️ 淺色' : '🌙 深色';
        }

        function updateStatsUI() {
            document.getElementById('stat-win').textContent = aiStats.wins;
            document.getElementById('stat-loss').textContent = aiStats.losses;
            document.getElementById('stat-draw').textContent = aiStats.draws;
            localStorage.setItem('uttt_ai_stats', JSON.stringify(aiStats));
        }

        function resetStats() {
            aiStats = { wins: 0, losses: 0, draws: 0 };
            localStorage.removeItem('uttt_ai_stats');
            updateStatsUI();
        }

        function openUTTTRule() { openModal('rule-modal-uttt'); startDemoAnimation(); }
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { 
            document.getElementById(id).style.display = 'none'; 
            if (id === 'rule-modal-uttt') stopDemoAnimation();
        }

        // --- 動畫邏輯 ---
        let demoTimer = null;
        let demoStepIndex = 0;
        const demoStepsConfig = [
            { big: 4, small: 2, player: 'X', targetNext: 2 },
            { big: 2, small: 6, player: 'O', targetNext: 6 },
            { big: 6, small: 2, player: 'X', targetNext: 2 },
            { action: 'winBig' },
            { action: 'reset' }
        ];

        function initDemoBoard() {
            const board = document.getElementById('demo-board');
            board.innerHTML = '';
            for (let b = 0; b < 9; b++) {
                const bigCell = document.createElement('div');
                bigCell.className = 'demo-big-cell';
                bigCell.id = `demo-big-${b}`;
                for (let s = 0; s < 9; s++) {
                    const smallCell = document.createElement('div');
                    smallCell.className = 'demo-small-cell';
                    smallCell.id = `demo-cell-${b}-${s}`;
                    bigCell.appendChild(smallCell);
                }
                board.appendChild(bigCell);
            }
        }

        function startDemoAnimation() {
            stopDemoAnimation();
            initDemoBoard();
            demoStepIndex = 0;
            runDemoStep();
        }

        function stopDemoAnimation() { if (demoTimer) clearTimeout(demoTimer); }

        function runDemoStep() {
            if (demoStepIndex >= demoStepsConfig.length) demoStepIndex = 0;
            const data = demoStepsConfig[demoStepIndex];
            document.getElementById('demo-status-text').textContent = i18nData[currentLang].demoSteps[demoStepIndex];
            document.querySelectorAll('.demo-big-cell').forEach(el => el.classList.remove('active-target'));

            if (data.action === 'winBig') {
                ['demo-cell-4-0', 'demo-cell-4-4', 'demo-cell-4-8'].forEach(id => {
                    const c = document.getElementById(id);
                    if (c) { c.textContent = 'X'; c.className = 'demo-small-cell x'; }
                });
                const big4 = document.getElementById('demo-big-4');
                const overlay = document.createElement('div');
                overlay.className = 'demo-big-overlay';
                overlay.textContent = 'X';
                big4.appendChild(overlay);
            } else if (data.action === 'reset') {
                setTimeout(() => { initDemoBoard(); }, 2000);
            } else {
                const cell = document.getElementById(`demo-cell-${data.big}-${data.small}`);
                if (cell) {
                    cell.textContent = data.player;
                    cell.className = `demo-small-cell ${data.player.toLowerCase()}`;
                }
                const targetBig = document.getElementById(`demo-big-${data.targetNext}`);
                if (targetBig) targetBig.classList.add('active-target');
            }

            demoStepIndex++;
            demoTimer = setTimeout(runDemoStep, 3000);
        }

        // --- 終極圈圈叉叉 ---
        const PLAYER_X = 'X', PLAYER_O = 'O';
        let currentPlayer = PLAYER_X, activeBigCell = -1;
        let boardState = Array(9).fill(null).map(() => Array(9).fill(null));
        let bigBoardState = Array(9).fill(null);
        let utttGameOver = false, utttGameMode = 'pve';
        const winPatterns = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

        function onUTTTModeChange() {
            const mode = document.getElementById('uttt-mode').value;
            document.getElementById('ai-level').style.display = (mode === 'pve') ? 'inline-block' : 'none';
            document.getElementById('ai-score-container').style.display = (mode === 'pve') ? 'flex' : 'none';
            resetUTTT();
        }

        function createBoard() {
            const boardElement = document.getElementById('board');
            boardElement.innerHTML = '';
            for (let b = 0; b < 9; b++) {
                const bigCell = document.createElement('div');
                bigCell.className = `big-cell ${activeBigCell === b || activeBigCell === -1 ? 'active' : ''}`;
                bigCell.id = `big-${b}`;
                for (let s = 0; s < 9; s++) {
                    const smallCell = document.createElement('div');
                    smallCell.className = 'small-cell';
                    smallCell.id = `cell-${b}-${s}`;
                    smallCell.onclick = () => handleCellClick(b, s);
                    bigCell.appendChild(smallCell);
                }
                boardElement.appendChild(bigCell);
            }
        }

        function handleCellClick(b, s) {
            if (utttGameOver) return;
            if (utttGameMode === 'pve' && currentPlayer !== PLAYER_X) return;
            if (activeBigCell !== -1 && activeBigCell !== b) return;
            if (bigBoardState[b] !== null || boardState[b][s] !== null) return;

            makeUTTTMove(b, s, currentPlayer);
            if (!utttGameOver && utttGameMode === 'pve' && currentPlayer === PLAYER_O) {
                setTimeout(aiTurn, 250);
            }
        }

        function makeUTTTMove(b, s, player) {
            boardState[b][s] = player;
            const cell = document.getElementById(`cell-${b}-${s}`);
            cell.textContent = player;
            cell.classList.add('taken', player.toLowerCase());

            if (checkWin(boardState[b], player)) {
                bigBoardState[b] = player;
                renderBigCellOverlay(b, player);
            } else if (boardState[b].every(c => c !== null)) {
                bigBoardState[b] = 'D';
            }

            const lang = i18nData[currentLang];
            const isBoardFull = bigBoardState.every(c => c !== null);

            if (checkWin(bigBoardState, player)) {
                utttGameOver = true;
                let text = "";
                if (utttGameMode === 'pve') {
                    if (player === PLAYER_X) {
                        text = lang.winPvePlayer;
                        aiStats.wins++;
                    } else {
                        text = lang.winPveAi;
                        aiStats.losses++;
                    }
                    updateStatsUI();
                } else {
                    text = player === PLAYER_X ? lang.winPvpX : lang.winPvpO;
                }
                document.getElementById('status-container').innerHTML = `<span style="color:#2e7d32;">${text}</span>`;
                document.getElementById('winner-message').textContent = text;
                openModal('win-modal');
            } else if (isBoardFull) {
                utttGameOver = true;
                if (utttGameMode === 'pve') {
                    aiStats.draws++;
                    updateStatsUI();
                }
                document.getElementById('status-container').innerHTML = `<span style="color:#ff9800;">${lang.winDraw}</span>`;
                document.getElementById('winner-message').textContent = lang.winDraw;
                openModal('win-modal');
            } else {
                activeBigCell = (bigBoardState[s] === null && boardState[s].includes(null)) ? s : -1;
                currentPlayer = currentPlayer === PLAYER_X ? PLAYER_O : PLAYER_X;
                updateUTTTStatus();
                updateUTTTHighlight();
            }
        }

        function renderBigCellOverlay(b, player) {
            const bigCell = document.getElementById(`big-${b}`);
            const overlay = document.createElement('div');
            overlay.className = `big-cell-overlay ${player.toLowerCase()}`;
            overlay.textContent = player;
            bigCell.appendChild(overlay);
        }

        function updateUTTTStatus() {
            if (utttGameOver) return;
            const lang = i18nData[currentLang];
            const container = document.getElementById('status-container');
            if (!document.getElementById('player-badge')) {
                container.innerHTML = `<span>${lang.turnPrefix}</span><span id="player-badge" class="player-badge"></span> <span id="target-text"></span>`;
            }
            const badge = document.getElementById('player-badge');
            const targetText = document.getElementById('target-text');
            const board = document.getElementById('board');

            if (currentPlayer === PLAYER_X) {
                badge.className = 'player-badge x-turn';
                badge.textContent = utttGameMode === 'pve' ? lang.player : lang.p1;
                board.className = 'ultimate-board turn-x';
            } else {
                badge.className = 'player-badge o-turn';
                badge.textContent = utttGameMode === 'pve' ? lang.ai : lang.p2;
                board.className = 'ultimate-board turn-o';
            }
            targetText.textContent = activeBigCell === -1 ? lang.freeMove : `${lang.limitSector}[${activeBigCell + 1}]`;
        }

        function updateUTTTHighlight() {
            for (let b = 0; b < 9; b++) {
                const bigCell = document.getElementById(`big-${b}`);
                if (!utttGameOver && bigBoardState[b] === null && (activeBigCell === -1 || activeBigCell === b)) {
                    bigCell.classList.add('active');
                } else {
                    bigCell.classList.remove('active');
                }
            }
        }

        function checkWin(board, player) { return winPatterns.some(p => p.every(i => board[i] === player)); }

        // --- AI ---
        function aiTurn() {
            const level = document.getElementById('ai-level').value;
            let move = null;
            if (level === 'easy') move = getRandomMove();
            else if (level === 'normal') move = getTacticalMove();
            else if (level === 'hard') move = getBestMinimaxMove();

            if (move) makeUTTTMove(move.b, move.s, PLAYER_O);
        }

        function getValidMoves() {
            let moves = [];
            let validBoards = (activeBigCell === -1) ? [0,1,2,3,4,5,6,7,8] : [activeBigCell];
            validBoards.forEach(b => {
                if (bigBoardState[b] === null) {
                    for (let s = 0; s < 9; s++) {
                        if (boardState[b][s] === null) moves.push({ b, s });
                    }
                }
            });
            return moves;
        }

        function getRandomMove() {
            const moves = getValidMoves();
            return moves.length > 0 ? moves[Math.floor(Math.random() * moves.length)] : null;
        }

        function getTacticalMove() {
            const moves = getValidMoves();
            if (moves.length === 0) return null;

            for (let move of moves) {
                boardState[move.b][move.s] = PLAYER_O;
                if (checkWin(boardState[move.b], PLAYER_O)) {
                    boardState[move.b][move.s] = null;
                    return move;
                }
                boardState[move.b][move.s] = null;
            }

            for (let move of moves) {
                boardState[move.b][move.s] = PLAYER_X;
                if (checkWin(boardState[move.b], PLAYER_X)) {
                    boardState[move.b][move.s] = null;
                    return move;
                }
                boardState[move.b][move.s] = null;
            }

            return getRandomMove();
        }

        function getBestMinimaxMove() {
            const moves = getValidMoves();
            if (moves.length === 0) return null;

            let bestScore = -Infinity;
            let bestMove = moves[0];

            for (let move of moves) {
                boardState[move.b][move.s] = PLAYER_O;
                let prevBig = bigBoardState[move.b];

                if (checkWin(boardState[move.b], PLAYER_O)) bigBoardState[move.b] = PLAYER_O;

                let nextActive = (bigBoardState[move.s] === null && boardState[move.s].includes(null)) ? move.s : -1;
                let score = minimax(2, false, -10000, 10000, nextActive);

                boardState[move.b][move.s] = null;
                bigBoardState[move.b] = prevBig;

                if (score > bestScore) {
                    bestScore = score;
                    bestMove = move;
                }
            }
            return bestMove;
        }

        function minimax(depth, isMax, alpha, beta, targetBoard) {
            if (checkWin(bigBoardState, PLAYER_O)) return 1000 + depth;
            if (checkWin(bigBoardState, PLAYER_X)) return -1000 - depth;
            if (depth === 0) return evaluateState();

            let validBoards = (targetBoard === -1) ? [0,1,2,3,4,5,6,7,8] : [targetBoard];
            let moves = [];
            validBoards.forEach(b => {
                if (bigBoardState[b] === null) {
                    for (let s = 0; s < 9; s++) {
                        if (boardState[b][s] === null) moves.push({ b, s });
                    }
                }
            });

            if (moves.length === 0) return 0;

            if (isMax) {
                let maxEval = -Infinity;
                for (let move of moves) {
                    boardState[move.b][move.s] = PLAYER_O;
                    let prevBig = bigBoardState[move.b];
                    if (checkWin(boardState[move.b], PLAYER_O)) bigBoardState[move.b] = PLAYER_O;

                    let nextActive = (bigBoardState[move.s] === null && boardState[move.s].includes(null)) ? move.s : -1;
                    let evalVal = minimax(depth - 1, false, alpha, beta, nextActive);

                    boardState[move.b][move.s] = null;
                    bigBoardState[move.b] = prevBig;

                    maxEval = Math.max(maxEval, evalVal);
                    alpha = Math.max(alpha, evalVal);
                    if (beta <= alpha) break;
                }
                return maxEval;
            } else {
                let minEval = Infinity;
                for (let move of moves) {
                    boardState[move.b][move.s] = PLAYER_X;
                    let prevBig = bigBoardState[move.b];
                    if (checkWin(boardState[move.b], PLAYER_X)) bigBoardState[move.b] = PLAYER_X;

                    let nextActive = (bigBoardState[move.s] === null && boardState[move.s].includes(null)) ? move.s : -1;
                    let evalVal = minimax(depth - 1, true, alpha, beta, nextActive);

                    boardState[move.b][move.s] = null;
                    bigBoardState[move.b] = prevBig;

                    minEval = Math.min(minEval, evalVal);
                    beta = Math.min(beta, evalVal);
                    if (beta <= alpha) break;
                }
                return minEval;
            }
        }

        function evaluateState() {
            let score = 0;
            for (let b = 0; b < 9; b++) {
                if (bigBoardState[b] === PLAYER_O) score += 100;
                else if (bigBoardState[b] === PLAYER_X) score -= 100;
                else {
                    for (let s = 0; s < 9; s++) {
                        if (boardState[b][s] === PLAYER_O) score += (s === 4 ? 3 : 1);
                        else if (boardState[b][s] === PLAYER_X) score -= (s === 4 ? 3 : 1);
                    }
                }
            }
            return score;
        }

        function resetUTTT() {
            utttGameMode = document.getElementById('uttt-mode').value;
            document.getElementById('ai-level').style.display = (utttGameMode === 'pve') ? 'inline-block' : 'none';
            document.getElementById('ai-score-container').style.display = (utttGameMode === 'pve') ? 'flex' : 'none';
            currentPlayer = PLAYER_X;
            activeBigCell = -1;
            boardState = Array(9).fill(null).map(() => Array(9).fill(null));
            bigBoardState = Array(9).fill(null);
            utttGameOver = false;
            createBoard();
            updateUTTTStatus();
            updateUTTTHighlight();
        }

        window.addEventListener('beforeunload', function (e) {
            if (!utttGameOver) {
                const confirmationMessage = '遊戲玩到一半不會儲存';
                e.preventDefault();
                e.returnValue = confirmationMessage;
                return confirmationMessage;
            }
        });

        // ============ 關鍵修復：確保 DOM 完全加載再初始化 ============
        // 延遲執行確保 CSS 和 DOM 都已完成加載
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function() {
                updateUI();
                updateStatsUI();
                resetUTTT();
                console.log('✅ 棋盤已初始化完成');
            });
        } else {
            // 如果此時 DOM 已加載，直接執行
            updateUI();
            updateStatsUI();
            resetUTTT();
            console.log('✅ 棋盤已初始化完成');
        }
    </script>
</body>
</html>
