<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-i18n="docTitle">中國象棋</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --text-color: #222222;
            --card-bg: #ffffff;
            --border-color: #cccccc;
            --primary-btn: #4caf50;
            --primary-btn-hover: #45a049;
            --panel-bg: #ffffff;
            --footer-color: #777777;
        }

        body.dark-mode {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --card-bg: #1e1e1e;
            --border-color: #444444;
            --primary-btn: #388e3c;
            --primary-btn-hover: #2e7d32;
            --panel-bg: #1e1e1e;
            --footer-color: #aaaaaa;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Arial, "Kaiti SC", "KaiTi", "標楷體", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 10px;
            padding: 0;
            min-height: 98vh;
            transition: background-color 0.3s, color 0.3s;
        }

        .controls {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 900px;
        }

        select, button {
            padding: 6px 12px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-color);
            cursor: pointer;
        }

        button { background-color: var(--primary-btn); color: white; border: none; }
        button:hover { background-color: var(--primary-btn-hover); }

        .btn-home { background-color: #2196f3; }
        .btn-lang { background-color: #ff9800; }
        .btn-theme { background-color: #9c27b0; }
        .btn-danger { background-color: #f44336; }

        .game-view { display: flex; width: 100%; max-width: 900px; flex-direction: column; align-items: center; flex: 1; }

        .score-board {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 6px 16px;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        .chess-wrapper {
            position: relative;
            background: #e1be79 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="%23e1be79"/><path d="0 0 L100 100 M100 0 L0 100" stroke="%23d8b067" stroke-width="1" opacity="0.15"/></svg>');
            padding: 10px;
            border-radius: 6px;
            border: 8px solid #5a3212;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5), 0 8px 25px rgba(0,0,0,0.5);
            margin: 5px auto;
        }

        .chess-board {
            position: relative;
            width: 360px;
            height: 400px;
            user-select: none;
        }

        .check-banner {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            background: rgba(211, 47, 47, 0.95);
            color: #fff176;
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 2px;
            border: 3px solid #ffd54f;
            box-shadow: 0 0 20px rgba(244, 67, 54, 0.8), inset 0 0 10px rgba(255, 255, 255, 0.5);
            z-index: 100;
            cursor: pointer;
            white-space: nowrap;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .check-banner.show {
            display: block;
            animation: checkPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, checkPulse 1s infinite alternate;
        }

        .check-banner:hover {
            transform: translate(-50%, -50%) scale(1.05);
        }

        @keyframes checkPop {
            0% { transform: translate(-50%, -50%) scale(0.2); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        @keyframes checkPulse {
            0% { transform: translate(-50%, -50%) scale(1); box-shadow: 0 0 15px rgba(244, 67, 54, 0.8); }
            100% { transform: translate(-50%, -50%) scale(1.08); box-shadow: 0 0 30px rgba(255, 235, 59, 1); }
        }

        .full-board-svg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
        }

        .full-board-interactive {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            grid-template-rows: repeat(10, 1fr);
            z-index: 2;
        }

        .chess-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            z-index: 2;
        }

        .chess-cell.valid-move::before {
            content: '';
            width: 12px;
            height: 12px;
            background-color: #4caf50;
            border-radius: 50%;
            box-shadow: 0 0 6px #4caf50;
            z-index: 5;
            position: absolute;
        }

        .chess-cell.valid-capture .chess-piece {
            box-shadow: 0 0 12px #f44336, 0 4px 10px rgba(0,0,0,0.5);
            border-color: #f44336 !important;
            animation: pulse-capture 1s infinite alternate;
        }

        @keyframes pulse-capture {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        .chess-piece {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 900;
            font-family: "Kaiti SC", "KaiTi", "標楷體", serif;
            background: radial-gradient(circle at 35% 35%, #ffffff 0%, #f0ede6 70%, #d8d3c5 100%);
            box-shadow: 1px 3px 6px rgba(0,0,0,0.5), inset 0 0 2px rgba(0,0,0,0.3);
            border: 2px solid #b5b0a3;
            transition: transform 0.15s ease;
            position: relative;
        }

        .chess-piece::after {
            content: '';
            position: absolute;
            top: 2px; left: 2px; right: 2px; bottom: 2px;
            border-radius: 50%;
            border: 1px solid rgba(0,0,0,0.15);
            pointer-events: none;
        }

        .chess-piece.red { color: #d32f2f; border-color: #e57373; }
        .chess-piece.black { color: #111111; border-color: #757575; }

        .chess-cell.selected .chess-piece {
            transform: scale(1.18);
            box-shadow: 0 0 12px #ffeb3b, 0 4px 10px rgba(0,0,0,0.5);
            border-color: #fbc02d;
            z-index: 10;
        }

        .status-in-check {
            color: #f44336 !important;
            font-size: 16px !important;
            animation: textBlink 0.8s infinite alternate;
        }

        @keyframes textBlink {
            0% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        .modal {
            display: flex;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--card-bg);
            color: var(--text-color);
            padding: 20px;
            border-radius: 12px;
            max-width: 420px;
            width: 90%;
            position: relative;
            border: 1px solid var(--border-color);
        }

        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 22px; font-weight: bold; cursor: pointer; }

        .reason-box {
            background: rgba(244, 67, 54, 0.1);
            border-left: 4px solid #f44336;
            padding: 10px;
            margin: 12px 0;
            font-size: 14px;
            text-align: left;
            line-height: 1.5;
            border-radius: 4px;
        }

        footer {
            margin-top: auto;
            padding: 20px 0 10px 0;
            font-size: 12px;
            color: var(--footer-color);
            text-align: center;
            width: 100%;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body class="dark-mode">

    <div class="controls" style="justify-content: space-between;">
        <button class="btn-home" onclick="goHome()" data-i18n="homeBtn">🏠 首頁</button>
        <span id="header-title" style="font-weight: bold; font-size: 16px;" data-i18n="headerTitle">🪨 中國象棋（傳統大棋盤）</span>
        <div style="display: flex; gap: 6px;">
            <button class="btn-lang" onclick="toggleLanguage()" id="lang-btn">English</button>
            <button class="btn-theme" id="theme-btn" onclick="toggleDarkMode()">☀️ 淺色</button>
        </div>
    </div>

    <div id="view-chess" class="game-view">
        <div class="controls">
            <span id="chess-mode-title" style="font-weight: bold; font-size: 16px;" data-i18n="modeTitle">傳統象棋</span>
            <select id="chess-game-mode" onchange="onChessModeChange()">
                <option value="pve" selected data-i18n="pveOption">單人對戰 (AI)</option>
                <option value="pvp" data-i18n="pvpOption">雙人對戰</option>
            </select>
            <select id="chess-ai-level" onchange="initChessGame()">
                <option value="easy" data-i18n="aiEasy">AI: 初級</option>
                <option value="hard" selected data-i18n="aiHard">AI: 高級 (Minimax)</option>
            </select>
            <button onclick="initChessGame()" data-i18n="restartBtn">重來</button>
        </div>

        <div id="chess-ai-score-container" class="score-board">
            <span data-i18n="aiRecord">🤖 象棋 AI 戰績：</span>
            <span style="color:#4caf50;"><span data-i18n="winLabel">勝</span>: <span id="chess-stat-win">0</span></span>
            <span style="color:#f44336;"><span data-i18n="lossLabel">敗</span>: <span id="chess-stat-loss">0</span></span>
            <span style="color:#ff9800;"><span data-i18n="drawLabel">和</span>: <span id="chess-stat-draw">0</span></span>
            <button onclick="resetChessStats()" style="padding: 2px 6px; font-size: 11px; margin-left: 5px;" class="btn-danger" data-i18n="resetBtn">重置</button>
        </div>

        <div id="chess-status" style="font-weight: bold; margin-bottom: 8px;">紅方 (玩家) 先走，請點擊棋子移動</div>

        <div class="chess-wrapper">
            <div id="check-banner" class="check-banner" onclick="dismissCheckBanner()">⚠️ 將軍！CHECK!</div>
            <div class="chess-board" id="chess-board"></div>
        </div>
    </div>

    <div class="modal" id="win-modal" style="display: none;">
        <div class="modal-content" style="text-align:center;">
            <span class="close-btn" onclick="closeModal('win-modal')">&times;</span>
            <h2 data-i18n="gameOverTitle">🏆 遊戲結束！</h2>
            <div id="winner-message" style="font-size:18px; color:#2e7d32; margin:10px 0; font-weight:bold;"></div>
            <div id="winner-reason" class="reason-box"></div>
            <button onclick="closeModal('win-modal')" style="width:100%;" data-i18n="confirmBtn">確定</button>
        </div>
    </div>

    <footer>
        Copyright © 2026 Gemini. All Rights Reserved.
    </footer>

    <script>
        let currentLang = 'zh';

        const i18nData = {
            zh: {
                docTitle: "中國象棋",
                homeBtn: "🏠 首頁",
                headerTitle: "🪨 中國象棋（傳統大棋盤）",
                modeTitle: "傳統象棋",
                pveOption: "單人對戰 (AI)",
                pvpOption: "雙人對戰",
                aiEasy: "AI: 初級",
                aiHard: "AI: 高級 (Minimax)",
                restartBtn: "重來",
                aiRecord: "🤖 象棋 AI 戰績：",
                winLabel: "勝",
                lossLabel: "敗",
                drawLabel: "和",
                resetBtn: "重置",
                statusRedStart: "紅方 (玩家) 先走，請點擊棋子移動",
                statusRedTurn: "輪到 🔴 紅方 行棋",
                statusBlackTurn: "輪到 ⚫ 黑方 行棋",
                statusRedCheck: "⚡ 🔴 紅方 被「將軍」！請儘快應將",
                statusBlackCheck: "⚡ ⚫ 黑方 被「將軍」！請儘快應將",
                checkBanner: "⚠️ 將軍！CHECK!",
                gameOverTitle: "🏆 遊戲結束！",
                confirmBtn: "確定",
                facingViolationRed: "🔴 紅方 觸犯「將帥直接對視」規則！",
                facingViolationBlack: "⚫ 黑方 觸犯「將帥直接對視」規則！",
                facingReason: "⚠️ 走棋後導致將帥直接對面，違反象棋基本規定，判定違規敗！",
                checkmateRedWin: "🎉 🔴 紅方「將死」對方，獲得勝利！",
                checkmateBlackWin: "🎉 ⚫ 黑方「將死」對方，獲得勝利！",
                checkmateReasonRed: "⚠️ 黑方的【將】已被完全圍困，不管怎麼移動都無法解將！",
                checkmateReasonBlack: "⚠️ 你的【帥】已被完全圍困，不管怎麼移動都無法解將！",
                stalemateRedWin: "🎉 🔴 紅方使對方「困斃」，獲得勝利！",
                stalemateBlackWin: "🎉 ⚫ 黑方使對方「困斃」，獲得勝利！",
                stalemateReasonRed: "⚠️ 黑方的所有棋子都被完全堵住，無任何合法的棋步可走！",
                stalemateReasonBlack: "⚠️ 你的所有棋子都被完全堵住，無任何合法的棋步可走！",
                winRed: "🎉 🔴 紅方擊殺敵將，獲得勝利！",
                winBlack: "🎉 ⚫ 黑方擊殺敵將，獲得勝利！",
                captureReason: "⚠️ 主帥/大將已被吃掉！",
                confirmHome: "離開後當前遊戲進度與結果將不會儲存，確定要返回首頁嗎？"
            },
            en: {
                docTitle: "Xiangqi (Chinese Chess)",
                homeBtn: "🏠 Home",
                headerTitle: "🪨 Xiangqi (Chinese Chess)",
                modeTitle: "Xiangqi",
                pveOption: "1 Player (vs AI)",
                pvpOption: "2 Players",
                aiEasy: "AI: Easy",
                aiHard: "AI: Hard (Minimax)",
                restartBtn: "Restart",
                aiRecord: "🤖 AI Record:",
                winLabel: "Wins",
                lossLabel: "Losses",
                drawLabel: "Draws",
                resetBtn: "Reset",
                statusRedStart: "Red (Player) goes first. Click a piece to move.",
                statusRedTurn: "Turn: 🔴 Red",
                statusBlackTurn: "Turn: ⚫ Black",
                statusRedCheck: "⚡ 🔴 Red is in CHECK!",
                statusBlackCheck: "⚡ ⚫ Black is in CHECK!",
                checkBanner: "⚠️ CHECK!",
                gameOverTitle: "🏆 Game Over!",
                confirmBtn: "OK",
                facingViolationRed: "🔴 Red violated 'Kings Facing' rule!",
                facingViolationBlack: "⚫ Black violated 'Kings Facing' rule!",
                facingReason: "⚠️ Moving led to Kings directly facing each other without blockers.",
                checkmateRedWin: "🎉 🔴 Checkmate! Red wins!",
                checkmateBlackWin: "🎉 ⚫ Checkmate! Black wins!",
                checkmateReasonRed: "⚠️ Black's King is completely trapped with no legal escape moves!",
                checkmateReasonBlack: "⚠️ Your King is completely trapped with no legal escape moves!",
                stalemateRedWin: "🎉 🔴 Stalemate! Red wins!",
                stalemateBlackWin: "🎉 ⚫ Stalemate! Black wins!",
                stalemateReasonRed: "⚠️ Black has no legal moves available (Stalemate)!",
                stalemateReasonBlack: "⚠️ You have no legal moves available (Stalemate)!",
                winRed: "🎉 🔴 Red captured the King and wins!",
                winBlack: "🎉 ⚫ Black captured the King and wins!",
                captureReason: "⚠️ The King has been captured!",
                confirmHome: "Current game progress will be lost. Return to home?"
            }
        };

        function goHome() {
            if (confirm(i18nData[currentLang].confirmHome)) {
                window.location.href = 'index.html';
            }
        }

        function toggleLanguage() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            document.getElementById('lang-btn').textContent = currentLang === 'zh' ? 'English' : '繁體中文';
            updateUI();
        }

        function updateUI() {
            const lang = i18nData[currentLang];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (lang[key]) el.textContent = lang[key];
            });
            document.getElementById('check-banner').textContent = lang.checkBanner;
            updateGameStatusUI();
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            document.getElementById('theme-btn').textContent = isDark ? '☀️ 淺色' : '🌙 深色';
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        let chessStats = JSON.parse(localStorage.getItem('chess_ai_stats')) || { wins: 0, losses: 0, draws: 0 };
        function updateChessStatsUI() {
            document.getElementById('chess-stat-win').textContent = chessStats.wins;
            document.getElementById('chess-stat-loss').textContent = chessStats.losses;
            document.getElementById('chess-stat-draw').textContent = chessStats.draws;
            localStorage.setItem('chess_ai_stats', JSON.stringify(chessStats));
        }
        function resetChessStats() {
            chessStats = { wins: 0, losses: 0, draws: 0 };
            localStorage.removeItem('chess_ai_stats');
            updateChessStatsUI();
        }

        let chessGameMode = 'pve'; 
        let chessPieces = []; 
        let chessSelectedIdx = -1;
        let chessValidMoves = [];
        let chessTurn = 'red';
        let playerColor = 'red'; 
        let aiColor = 'black';
        let chessGameOver = false;
        let isBannerDismissed = false;

        const pieceValues = { '帥': 10000, '將': 10000, '俥': 90, '車': 90, '炮': 45, '包': 45, '傌': 40, '馬': 40, '相': 20, '象': 20, '仕': 20, '士': 20, '兵': 10, '卒': 10 };

        function onChessModeChange() {
            chessGameMode = document.getElementById('chess-game-mode').value;
            document.getElementById('chess-ai-level').style.display = (chessGameMode === 'pve') ? 'inline-block' : 'none';
            document.getElementById('chess-ai-score-container').style.display = (chessGameMode === 'pve') ? 'flex' : 'none';
            initChessGame();
        }

        function initChessGame() {
            chessGameMode = document.getElementById('chess-game-mode').value;
            document.getElementById('chess-ai-level').style.display = (chessGameMode === 'pve') ? 'inline-block' : 'none';
            document.getElementById('chess-ai-score-container').style.display = (chessGameMode === 'pve') ? 'flex' : 'none';
            updateChessStatsUI();

            chessSelectedIdx = -1;
            chessValidMoves = [];
            chessTurn = 'red';
            playerColor = 'red';
            aiColor = 'black';
            chessGameOver = false;
            isBannerDismissed = false;

            chessPieces = Array(90).fill(null);
            
            const blackRow0 = ['車', '馬', '象', '士', '將', '士', '象', '馬', '車'];
            blackRow0.forEach((name, c) => chessPieces[0 * 9 + c] = { name, color: 'black', type: name });
            chessPieces[2 * 9 + 1] = { name: '包', color: 'black', type: '炮' };
            chessPieces[2 * 9 + 7] = { name: '包', color: 'black', type: '炮' };
            [0, 2, 4, 6, 8].forEach(c => chessPieces[3 * 9 + c] = { name: '卒', color: 'black', type: '卒' });

            [0, 2, 4, 6, 8].forEach(c => chessPieces[6 * 9 + c] = { name: '兵', color: 'red', type: '兵' });
            chessPieces[7 * 9 + 1] = { name: '炮', color: 'red', type: '炮' };
            chessPieces[7 * 9 + 7] = { name: '炮', color: 'red', type: '炮' };
            const redRow9 = ['俥', '傌', '相', '仕', '帥', '仕', '相', '傌', '俥'];
            redRow9.forEach((name, c) => chessPieces[9 * 9 + c] = { name, color: 'red', type: name });

            updateUI();
            renderChessBoard();
        }

        function dismissCheckBanner() {
            document.getElementById('check-banner').classList.remove('show');
            isBannerDismissed = true;
        }

        function isCheck(board, targetColor) {
            let kingIdx = -1;
            const targetKingName = targetColor === 'red' ? '帥' : '將';
            for (let i = 0; i < 90; i++) {
                if (board[i] && board[i].name === targetKingName) {
                    kingIdx = i;
                    break;
                }
            }
            if (kingIdx === -1) return false;

            const enemyColor = targetColor === 'red' ? 'black' : 'red';
            for (let i = 0; i < 90; i++) {
                if (board[i] && board[i].color === enemyColor) {
                    if (canChessMove(i, kingIdx, board)) {
                        return true;
                    }
                }
            }
            return false;
        }

        function updateGameStatusUI() {
            if (chessGameOver) return;
            const lang = i18nData[currentLang];
            const statusEl = document.getElementById('chess-status');
            const checkBanner = document.getElementById('check-banner');

            const inCheck = isCheck(chessPieces, chessTurn);

            if (inCheck) {
                if (!isBannerDismissed) {
                    checkBanner.classList.add('show');
                }
                statusEl.classList.add('status-in-check');
                statusEl.textContent = chessTurn === 'red' ? lang.statusRedCheck : lang.statusBlackCheck;
            } else {
                isBannerDismissed = false;
                checkBanner.classList.remove('show');
                statusEl.classList.remove('status-in-check');
                if (chessTurn === 'red') {
                    statusEl.textContent = chessSelectedIdx === -1 && chessPieces.filter(p=>p).length === 32 ? lang.statusRedStart : lang.statusRedTurn;
                } else {
                    statusEl.textContent = lang.statusBlackTurn;
                }
            }
        }

        function getValidMovesForPiece(fromIdx) {
            let moves = [];
            const piece = chessPieces[fromIdx];
            if (!piece) return moves;

            for (let to = 0; to < 90; to++) {
                if (canChessMove(fromIdx, to, chessPieces)) {
                    const src = chessPieces[fromIdx];
                    const dst = chessPieces[to];
                    chessPieces[to] = src;
                    chessPieces[fromIdx] = null;

                    const facing = isKingsFacing(chessPieces);
                    const selfInCheck = isCheck(chessPieces, piece.color);

                    chessPieces[fromIdx] = src;
                    chessPieces[to] = dst;

                    if (!facing && !selfInCheck) {
                        moves.push(to);
                    }
                }
            }
            return moves;
        }

        function renderChessBoard() {
            const board = document.getElementById('chess-board');
            board.innerHTML = '';
            board.className = 'chess-board';
            board.style.width = "360px";
            board.style.height = "400px";

            const svgNS = "http://www.w3.org/2000/svg";
            const svg = document.createElementNS(svgNS, "svg");
            svg.setAttribute("class", "full-board-svg");
            svg.setAttribute("viewBox", "0 0 360 400");

            let lines = "";
            const cellW = 360 / 9;
            const cellH = 400 / 10;
            const offsetX = cellW / 2;
            const offsetY = cellH / 2;

            lines += `<rect x="${offsetX-2}" y="${offsetY-2}" width="${cellW*8+4}" height="${cellH*9+4}" stroke="#704214" stroke-width="2" fill="none"/>`;

            for (let r = 0; r < 10; r++) {
                lines += `<line x1="${offsetX}" y1="${offsetY + r*cellH}" x2="${offsetX + 8*cellW}" y2="${offsetY + r*cellH}" stroke="#704214" stroke-width="1.5"/>`;
            }
            for (let c = 0; c < 9; c++) {
                if (c === 0 || c === 8) {
                    lines += `<line x1="${offsetX + c*cellW}" y1="${offsetY}" x2="${offsetX + c*cellW}" y2="${offsetY + 9*cellH}" stroke="#704214" stroke-width="1.5"/>`;
                } else {
                    lines += `<line x1="${offsetX + c*cellW}" y1="${offsetY}" x2="${offsetX + c*cellW}" y2="${offsetY + 4*cellH}" stroke="#704214" stroke-width="1.5"/>`;
                    lines += `<line x1="${offsetX + c*cellW}" y1="${offsetY + 5*cellH}" x2="${offsetX + c*cellW}" y2="${offsetY + 9*cellH}" stroke="#704214" stroke-width="1.5"/>`;
                }
            }

            lines += `<text x="${offsetX + 1.8*cellW}" y="${offsetY + 4.7*cellH}" font-size="22" fill="#704214" font-weight="bold" font-family="KaiTi, 標楷體">楚 河</text>`;
            lines += `<text x="${offsetX + 5.2*cellW}" y="${offsetY + 4.7*cellH}" font-size="22" fill="#704214" font-weight="bold" font-family="KaiTi, 標楷體">漢 界</text>`;

            lines += `<line x1="${offsetX + 3*cellW}" y1="${offsetY}" x2="${offsetX + 5*cellW}" y2="${offsetY + 2*cellH}" stroke="#704214" stroke-width="1.2"/>`;
            lines += `<line x1="${offsetX + 5*cellW}" y1="${offsetY}" x2="${offsetX + 3*cellW}" y2="${offsetY + 2*cellH}" stroke="#704214" stroke-width="1.2"/>`;

            lines += `<line x1="${offsetX + 3*cellW}" y1="${offsetY + 7*cellH}" x2="${offsetX + 5*cellW}" y2="${offsetY + 9*cellH}" stroke="#704214" stroke-width="1.2"/>`;
            lines += `<line x1="${offsetX + 5*cellW}" y1="${offsetY + 7*cellH}" x2="${offsetX + 3*cellW}" y2="${offsetY + 9*cellH}" stroke="#704214" stroke-width="1.2"/>`;

            svg.innerHTML = lines;
            board.appendChild(svg);

            const overlay = document.createElement('div');
            overlay.className = 'full-board-interactive';

            for (let i = 0; i < 90; i++) {
                const cell = document.createElement('div');
                
                let cellClass = `chess-cell ${chessSelectedIdx === i ? 'selected' : ''}`;
                
                if (chessValidMoves.includes(i)) {
                    if (chessPieces[i]) {
                        cellClass += ' valid-capture';
                    } else {
                        cellClass += ' valid-move';
                    }
                }

                cell.className = cellClass;
                cell.onclick = () => handleChessClick(i);

                const piece = chessPieces[i];
                if (piece) {
                    const pieceEl = document.createElement('div');
                    pieceEl.className = `chess-piece ${piece.color}`;
                    pieceEl.textContent = piece.name;
                    cell.appendChild(pieceEl);
                }
                overlay.appendChild(cell);
            }
            board.appendChild(overlay);
        }

        function handleChessClick(idx) {
            if (chessGameOver) return;
            if (chessGameMode === 'pve' && chessTurn === aiColor) return;

            const piece = chessPieces[idx];

            if (piece && piece.color === chessTurn) {
                chessSelectedIdx = idx;
                chessValidMoves = getValidMovesForPiece(idx);
                renderChessBoard();
                return;
            }

            if (chessSelectedIdx !== -1) {
                if (chessValidMoves.includes(idx)) {
                    chessPieces[idx] = chessPieces[chessSelectedIdx];
                    chessPieces[chessSelectedIdx] = null;

                    if (isKingsFacing(chessPieces)) {
                        chessSelectedIdx = -1;
                        chessValidMoves = [];
                        renderChessBoard();
                        chessGameOver = true;
                        const loser = chessTurn;
                        const winner = loser === 'red' ? 'black' : 'red';
                        const lang = i18nData[currentLang];
                        endGame(winner, loser === 'red' ? lang.facingViolationRed : lang.facingViolationBlack, lang.facingReason);
                        return;
                    }

                    chessSelectedIdx = -1;
                    chessValidMoves = [];
                    renderChessBoard();

                    if (checkChessWin()) return;

                    switchChessTurn();
                    checkChessAITurn();
                }
            }
        }

        function isKingsFacing(board) {
            let redKingIdx = -1, blackKingIdx = -1;
            for (let i = 0; i < 90; i++) {
                if (board[i]) {
                    if (board[i].name === '帥') redKingIdx = i;
                    if (board[i].name === '將') blackKingIdx = i;
                }
            }

            if (redKingIdx === -1 || blackKingIdx === -1) return false;

            const redC = redKingIdx % 9, redR = Math.floor(redKingIdx / 9);
            const blackC = blackKingIdx % 9, blackR = Math.floor(blackKingIdx / 9);

            if (redC !== blackC) return false;

            let minR = Math.min(redR, blackR);
            let maxR = Math.max(redR, blackR);

            for (let r = minR + 1; r < maxR; r++) {
                if (board[r * 9 + redC] !== null) {
                    return false;
                }
            }
            return true;
        }

        function canChessMove(fromIdx, toIdx, board) {
            const attacker = board[fromIdx];
            const defender = board[toIdx];

            if (!attacker) return false;
            if (defender && defender.color === attacker.color) return false;

            const fromR = Math.floor(fromIdx / 9), fromC = fromIdx % 9;
            const toR = Math.floor(toIdx / 9), toC = toIdx % 9;
            const dr = Math.abs(fromR - toR);
            const dc = Math.abs(fromC - toC);

            switch (attacker.type) {
                case '將': case '帥':
                    if (dc + dr !== 1) return false;
                    if (toC < 3 || toC > 5) return false;
                    if (attacker.color === 'black' && toR > 2) return false;
                    if (attacker.color === 'red' && toR < 7) return false;
                    return true;
                case '士': case '仕':
                    if (dr !== 1 || dc !== 1) return false;
                    if (toC < 3 || toC > 5) return false;
                    if (attacker.color === 'black' && toR > 2) return false;
                    if (attacker.color === 'red' && toR < 7) return false;
                    return true;
                case '象': case '相':
                    if (dr !== 2 || dc !== 2) return false;
                    if (attacker.color === 'black' && toR > 4) return false; 
                    if (attacker.color === 'red' && toR < 5) return false;
                    if (board[Math.floor((fromR+toR)/2)*9 + Math.floor((fromC+toC)/2)]) return false;
                    return true;
                case '馬': case '傌':
                    if (!((dr === 1 && dc === 2) || (dr === 2 && dc === 1))) return false;
                    if (dr === 2 && board[Math.floor((fromR+toR)/2)*9 + fromC]) return false;
                    if (dc === 2 && board[fromR*9 + Math.floor((fromC+toC)/2)]) return false;
                    return true;
                case '車': case '俥':
                    if (fromR !== toR && fromC !== toC) return false;
                    return countPiecesBetweenOnBoard(fromIdx, toIdx, board) === 0;
                case '炮': case '包':
                    if (fromR !== toR && fromC !== toC) return false;
                    let count = countPiecesBetweenOnBoard(fromIdx, toIdx, board);
                    if (!defender) return count === 0;
                    return count === 1;
                case '卒': case '兵':
                    if (dr + dc !== 1) return false;
                    if (attacker.color === 'black') {
                        if (toR < fromR) return false; 
                        if (fromR <= 4 && dc > 0) return false;
                    } else {
                        if (toR > fromR) return false;
                        if (fromR >= 5 && dc > 0) return false;
                    }
                    return true;
                default:
                    return false;
            }
        }

        function countPiecesBetweenOnBoard(fromIdx, toIdx, board) {
            const fromR = Math.floor(fromIdx / 9), fromC = fromIdx % 9;
            const toR = Math.floor(toIdx / 9), toC = toIdx % 9;
            let count = 0;

            if (fromR === toR) {
                let min = Math.min(fromC, toC), max = Math.max(fromC, toC);
                for (let c = min + 1; c < max; c++) if (board[fromR * 9 + c]) count++;
            } else if (fromC === toC) {
                let min = Math.min(fromR, toR), max = Math.max(fromR, toR);
                for (let r = min + 1; r < max; r++) if (board[r * 9 + fromC]) count++;
            }
            return count;
        }

        function switchChessTurn() {
            chessTurn = chessTurn === 'red' ? 'black' : 'red';
            isBannerDismissed = false;
            updateGameStatusUI();

            const legalMoves = getAllLegalMoves(chessPieces, chessTurn);
            if (legalMoves.length === 0) {
                chessGameOver = true;
                document.getElementById('check-banner').classList.remove('show');
                const winner = chessTurn === 'red' ? 'black' : 'red';
                const lang = i18nData[currentLang];
                const inCheck = isCheck(chessPieces, chessTurn);

                let winMsg = "";
                let reasonMsg = "";
                if (inCheck) {
                    winMsg = winner === 'red' ? lang.checkmateRedWin : lang.checkmateBlackWin;
                    reasonMsg = winner === 'red' ? lang.checkmateReasonRed : lang.checkmateReasonBlack;
                } else {
                    winMsg = winner === 'red' ? lang.stalemateRedWin : lang.stalemateBlackWin;
                    reasonMsg = winner === 'red' ? lang.stalemateReasonRed : lang.stalemateReasonBlack;
                }
                
                // 加 500ms 延遲，等畫面完全渲染完後再跳彈窗，不會太突兀
                setTimeout(() => {
                    endGame(winner, winMsg, reasonMsg);
                }, 500);
            }
        }

        function checkChessWin() {
            let redKing = false, blackKing = false;

            chessPieces.forEach(p => {
                if (p) {
                    if (p.name === '帥') redKing = true;
                    if (p.name === '將') blackKing = true;
                }
            });

            let winner = null;
            if (!redKing) winner = 'black';
            else if (!blackKing) winner = 'red';

            if (winner) {
                chessGameOver = true;
                document.getElementById('check-banner').classList.remove('show');
                const lang = i18nData[currentLang];
                setTimeout(() => {
                    endGame(winner, winner === 'red' ? lang.winRed : lang.winBlack, lang.captureReason);
                }, 500);
                return true;
            }
            return false;
        }

        function endGame(winner, message, reason) {
            if (chessGameMode === 'pve') {
                if (winner === playerColor) {
                    chessStats.wins++;
                } else {
                    chessStats.losses++;
                }
                updateChessStatsUI();
            }
            document.getElementById('winner-message').textContent = message;
            document.getElementById('winner-reason').textContent = reason || '';
            openModal('win-modal');
        }

        function checkChessAITurn() {
            if (chessGameOver || chessGameMode !== 'pve' || chessTurn !== aiColor) return;
            setTimeout(makeChessAIMove, 250);
        }

        function getAllLegalMoves(board, color) {
            let moves = [];
            for (let from = 0; from < 90; from++) {
                if (board[from] && board[from].color === color) {
                    for (let to = 0; to < 90; to++) {
                        if (canChessMove(from, to, board)) {
                            const src = board[from];
                            const dst = board[to];
                            board[to] = src;
                            board[from] = null;

                            const facing = isKingsFacing(board);
                            const selfInCheck = isCheck(board, color);

                            board[from] = src;
                            board[to] = dst;

                            if (!facing && !selfInCheck) {
                                moves.push({ from, to });
                            }
                        }
                    }
                }
            }
            return moves;
        }

        function evaluateBoard(board) {
            let score = 0;
            for (let i = 0; i < 90; i++) {
                const p = board[i];
                if (p) {
                    let val = pieceValues[p.name] || 10;
                    const r = Math.floor(i / 9);
                    const c = i % 9;

                    if (p.type === '兵' || p.type === '卒') {
                        if (p.color === 'black' && r >= 5) val += (r - 4) * 5;
                        if (p.color === 'red' && r <= 4) val += (5 - r) * 5;
                    }
                    if (p.type === '車' || p.type === '俥') {
                        if (c === 4) val += 10;
                    }

                    if (p.color === 'black') {
                        score += val;
                    } else {
                        score -= val;
                    }
                }
            }
            return score;
        }

        function minimax(board, depth, alpha, beta, isMaximizing) {
            if (depth === 0) {
                return evaluateBoard(board);
            }

            const currentTurn = isMaximizing ? 'black' : 'red';
            const moves = getAllLegalMoves(board, currentTurn);

            if (moves.length === 0) {
                return isMaximizing ? -99999 : 99999;
            }

            if (isMaximizing) {
                let maxEval = -Infinity;
                for (let move of moves) {
                    const src = board[move.from];
                    const dst = board[move.to];

                    board[move.to] = src;
                    board[move.from] = null;

                    let evalVal = minimax(board, depth - 1, alpha, beta, false);

                    board[move.from] = src;
                    board[move.to] = dst;

                    maxEval = Math.max(maxEval, evalVal);
                    alpha = Math.max(alpha, evalVal);
                    if (beta <= alpha) break;
                }
                return maxEval;
            } else {
                let minEval = Infinity;
                for (let move of moves) {
                    const src = board[move.from];
                    const dst = board[move.to];

                    board[move.to] = src;
                    board[move.from] = null;

                    let evalVal = minimax(board, depth - 1, alpha, beta, true);

                    board[move.from] = src;
                    board[move.to] = dst;

                    minEval = Math.min(minEval, evalVal);
                    beta = Math.min(beta, evalVal);
                    if (beta <= alpha) break;
                }
                return minEval;
            }
        }

        function makeChessAIMove() {
            if (chessGameOver) return;

            const level = document.getElementById('chess-ai-level').value;
            const moves = getAllLegalMoves(chessPieces, aiColor);

            if (moves.length === 0) return;

            let chosenMove = null;

            if (level === 'easy') {
                moves.forEach(m => {
                    const target = chessPieces[m.to];
                    m.score = target ? pieceValues[target.name] || 10 : 0;
                });
                moves.sort((a, b) => b.score - a.score);
                const topChoices = moves.filter(m => m.score === moves[0].score);
                chosenMove = topChoices[Math.floor(Math.random() * topChoices.length)];
            } else {
                let bestScore = -Infinity;
                let bestMoves = [];

                for (let move of moves) {
                    const src = chessPieces[move.from];
                    const dst = chessPieces[move.to];

                    chessPieces[move.to] = src;
                    chessPieces[move.from] = null;

                    let score = minimax(chessPieces, 2, -Infinity, Infinity, false);

                    chessPieces[move.from] = src;
                    chessPieces[move.to] = dst;

                    if (score > bestScore) {
                        bestScore = score;
                        bestMoves = [move];
                    } else if (score === bestScore) {
                        bestMoves.push(move);
                    }
                }

                chosenMove = bestMoves[Math.floor(Math.random() * bestMoves.length)];
            }

            if (chosenMove) {
                chessPieces[chosenMove.to] = chessPieces[chosenMove.from];
                chessPieces[chosenMove.from] = null;

                renderChessBoard();
                if (checkChessWin()) return;

                switchChessTurn();
            }
        }

        initChessGame();
    </script>
